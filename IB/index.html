<style type="text/css">

<script type="text/javascript">
jQuery.fn.stat = function (options) {
    var settings = jQuery.extend({
            total: '.totalpage',
            title: 'caption',
            content: 'table',
            files: 'tbody tr',
            stat: 'td.stat',
            completed: '●',
            index: 0,
            openAll: true,
            speed: 'fast',

            total2: '.totalpage2',
            files2: 'tbody td.order_bvs',
            stat2: 'td.order_bvs+td.stat',

            total3: '.totalpage3',
            files3: 'tbody td.order_oh',
            stat3: 'td.order_oh+td.stat',
        }, options),
        all_sections = this;
    return this.each(function () {
        var self = this,
            $self = $(self),
            title_text = [],
            completed = 0;
        self.section_title = $(settings.title, $self);
        self.content = $(settings.content, $self);
        self.files = $(settings.files, $self);
        self.files.each(function () {
            var stat = $(settings.stat, this);
            stat.each(function () {
                var text = $(this).text();
                if (text && (text === settings.completed)) {
                    completed++;
                }
            });
        });
        title_text = [self.section_title.text(), '(', completed, '/', self.files.length, ')'];
        self.section_title.text(title_text.join(''));

        //total
        var completedAll = 0;
        var completedPer = 0;
        $(settings.stat).each(function () {
            var text = $(this).text();
            if (text && (text == settings.completed)) {
                completedAll++;
                completedPer = Math.round((100 / $(settings.files).length) *
                    completedAll);
            }
        });
        $(settings.total).text('[Total : ' + completedAll + '/' + $(settings.files).length +
            'pages] [Progress : ' + completedPer + '%/' + '100%]');

        //유수지
        var completedAll2 = 0;
        var completedPer2 = 0;
        $(settings.stat2).each(function () {
            var text = $(this).text();
            if (text && (text == settings.completed)) {
                completedAll2++;
                completedPer2 = Math.round((100 / $(settings.files2).length) *
                    completedAll2);
            }
        });
        $(settings.total2).text('[Total : ' + completedAll2 + ' / ' + $(settings.files2)
            .length +
            'pages] [Progress : ' + completedPer2 + '% / ' + '100%]');

        //오광현
        var completedAll3 = 0;
        var completedPer3 = 0;
        $(settings.stat3).each(function () {
            var text = $(this).text();
            if (text && (text == settings.completed)) {
                completedAll3++;
                completedPer3 = Math.round((100 / $(settings.files3).length) *
                    completedAll3);
            }
        });
        $(settings.total3).text('[Total : ' + completedAll3 + ' / ' + $(settings.files3)
            .length +
            'pages] [Progress : ' + completedPer3 + '% / ' + '100%]');
    });
};
$(document).ready(function () {
    $('table').stat();
});


// 모든 클래스가 "mm"인 <td> 요소 선택
    var mmCells = document.querySelectorAll('.mm');

    // 값의 합 초기화
    var sum = 0;

    // 각 <td> 요소의 값을 합산
    mmCells.forEach(function(cell) {
        sum += parseFloat(cell.textContent || cell.innerText);
    });

    // 결과를 표시할 p 태그 선택
    var sumResultElement = document.getElementById('sumResult');

    // 결과를 표시할 p 태그에 결과 출력
    sumResultElement.textContent = sum;

</script>
