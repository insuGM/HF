<!DOCTYPE html>
<html lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">
	<link rel="icon" href="data:;base64,iVBORw0KGgo=">
	<meta property="og:type" content="website">
	<meta property="og:locale" content="ko">
	<meta property="og:site_name" content="한국주택금융공사">
	<meta property="og:updated_time" content="">
	<meta name="twitter:card" content="summary">
	<title>한국주택금융공사</title>

	<link rel="stylesheet" type="text/css" href="/resources/css/reset.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub3.css">
	<link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
	<link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">

	<!-- JavaScript 파일들 -->
	<script type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/common.js"></script>

	<script type="text/javascript" src="/resources/js/krds/krds.js"></script>
	<script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.custom.home.js"></script>
</head>
<body>
	<div class="wrap" id="wrap">
		<div data-include="../inc/header.html"></div>

		<div id="container">
			<div class="container_in">

				<!-- contents -->
				<div class="contents">

					<!-- sub_con -->
					<div class="sub_con page_board_notice_view">
						<!-- breadcrumb -->
						<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
							<ol class="breadcrumb">
								<li class="home"><a href="#" class="txt">홈</a></li>
								<li><a href="#" class="txt">서비스 신청</a></li>
								<li><a href="#" class="txt">서비스 신청2</a></li>
							</ol>
						</nav>
						<!--// breadcrumb -->
						<div class="page-title-wrap">
							<h2 class="h-tit">첨부 파일 예시</h2>
						</div>

						<!-- file upload -->
						<div class="krds-file-upload" data-max-files="20" data-max-size-mb="20">
							<!-- 파일 업로드 상단 -->
							<div class="file-head">
								<h3 class="tit">타이틀영역</h3>
								<div>
									<p>컨텐츠 영역</p>
								</div>
							</div>
							<!-- //파일 업로드 상단 -->

							<!-- 파일 업로드 영역 -->
							<div class="file-upload">
								<p class="txt">첨부할 파일을 여기에 끌어다 놓거나, 파일 선택 버튼을 눌러 파일을 직접 선택해주세요.</p>
								<div class="file-upload-btn-wrap">
									<input type="file" name="myFile" id="fileu-upload" multiple hidden>
									<label for="fileu-upload">
										<button type="button" class="krds-btn medium"><i class="svg-icon ico-upload"></i>파일선택</button>
									</label>
								</div>
							</div>
							<!-- //파일 업로드 영역 -->
							<!-- 파일 리스트 영역 -->
							<div class="file-list" style="display: none;">
								<div class="total"><span class="current">0개</span> / 10개</div>
								<ul class="upload-list">
									<!-- 파일 리스트는 JavaScript로 동적 생성됩니다 -->
								</ul>
								<div class="upload-delete-btn">
									<button type="button" class="krds-btn xsmall tertiary">전체 파일 삭제<i class="svg-icon ico-angle right"></i></button>
								</div>
							</div>
							<!-- //파일 리스트 영역 -->
						</div>
						<!-- //file upload -->

					</div>
					<!-- //sub_con -->
				</div>
				<!-- //contents -->

			</div> <!-- //container_in -->
		</div>

		<div data-include="../inc/footer.html"></div>
	</div> <!-- //wrap -->

	<div data-include="../inc/krds-popup-resize.html"></div>
</body>

<!-- 퍼블리싱에서만 추가되는 스크립트 -->
<script type="text/javascript" src="/resources/js/include.js"></script>
<!-- //퍼블리싱에서만 추가되는 스크립트 -->

</html>
