<body>
<div data-include="../inc/header.html"></div>

<div id="container">
	<div class="container_in">

		<!-- contents -->
		<div class="contents">
			<div class="sub_con hf_loan hfr">

				<!-- breadcrumb -->
				<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
					<ol class="breadcrumb">
						<li class="home"><a href="#" class="txt">홈</a></li>
						<li><a href="#" class="txt">주택담보대출</a></li>
						<li><a href="#" class="txt">대출 관리</a></li>
					</ol>
				</nav>
				<!--// breadcrumb -->

				<div class="title_set">
					<div class="page-title-wrap">
						<h2 class="h-tit">대출 계좌·상환 관리</h2>
					</div>

					<div class="title_etc_menu">
						<ul>
							<li class="print_li">
								<a href="#">
									<i class="svg-icon ico-down"></i>
									<span class="txt">뷰어 다운로드</span>
								</a>
							</li>
							<li class="print_li">
								<a href="#">
									<i class="svg-icon ico-print"></i>
									<span class="txt">인쇄</span>
								</a>
							</li>
						</ul>
					</div>
				</div>

				<!-- 컨텐츠 -->
				<div class="debt_cont">
					<div class="krds-tab-area tab_page layer list" id="tabLoanRepay">
						<div class="tab fill full line">
							<ul>
								<li data-listener-attached="true"><a href="#" class="btn-tab">실시간 상환신청</a></li>
								<li data-listener-attached="true"><a href="#" class="btn-tab">가상계좌상환 신청</a></li>
								<li data-listener-attached="true"><a href="#" class="btn-tab">자동이체 계좌 변경</a></li>
								<li class="active" data-listener-attached="true"><a href="#" class="btn-tab">대출상환일자 변경</a></li>
							</ul>
						</div>
						<div class="tab-conts-wrap type1">
							<section class="tab-conts active">
								<div class="debt_body">
					<div class="step_list_cont type1 step4">
						<ol class="krds-step-wrap">
						<li class="done">
							<span>
								<i class="step">1단계</i>
								<span class="step-tit">정보동의</span>
							</span>
						</li>
						<li class="active">
							<span>
								<em class="sr-only">현재단계</em>
								<i class="step">2단계</i>
								<span class="step-tit">납부일자 선택</span>
							</span>
						</li>
						<li>
							<span>
								<i class="step">3단계</i>
								<span class="step-tit">변경내역 확인</span>
							</span>
						</li>
						<li>
							<span>
								<i class="step">4단계</i>
								<span class="step-tit">변경결과 확인</span>
							</span>
						</li>
						</ol>
					</div>

					<div class="step_cont m0">
						<span><span class="blue">2단계</span> / 4단계</span>
						<h3 class="page_step_tit">납부일자 선택</h3>
					</div>

					<div class="etc_cont">
						<div class="exclamation">
							<div class="text"><i class="svg-icon ico_exclamation" aria-hidden="true"></i>모든 입력항목은 필수입니다.</div>
						</div>
						<div class="loan_card_cont">
							<div class="hf_info_field_cont">
								<div class="fieldset">
									<div class="hf_group">
										<div class="sub_title_cont"><h4 class="title"><label for="sel_acct">대출계좌 선택</label></h4></div>
										<div class="form-group">
											<div class="form-conts">
												<div class="krds_select_box is-open">
													<div class="select_tit"><button type="button" id="sel_acct" class="selected" aria-expanded="true">1311233123123 아낌e보금자리론</button></div>
													<div class="select_list">
														<ul>
														<li><button type="button" value="1311233123123">1311233123123 아낌e보금자리론</button></li>
														<li><button type="button" value="1311233123123">1311233123123 아낌e보금자리론</button></li>
														<li><button type="button" value="1311233123123">1311233123123 u-보금자리론</button></li>
														</ul>
													</div>
												</div>
												<button type="button" class="field_btn blue2">대출정보상세 조회</button>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="hf_info_field_cont">
						<div class="exclamation">
							<div class="text"><i class="svg-icon ico_exclamation" aria-hidden="true"></i>모든 입력항목은 필수입니다.</div>
						</div>
						<ul class="list">
							<li>
								<div class="main_title_cont"><h4 class="title">상환일자 선택</h4></div>
								<div class="fieldset">
									<div class="hf_group">
										<div class="sub_title_cont"><h5 class="title"><label for="inp_before_day">변경 전 상환일자 (현재)</label></h5></div>
										<div class="form-group">
											<div class="form-conts">
												<input type="text" class="krds-input" id="inp_before_day" value="매월 30일" readonly>
											</div>
										</div>
									</div>
									<div class="hf_group">
										<div class="sub_title_cont"><h5 class="title"><label for="sel_day">변경 후 상환일자</label></h5></div>
										<div class="form-group">
											<div class="form-conts">
												<div class="krds_select_box">
													<div class="select_tit"><button type="button" id="sel_day">일자를 선택해주세요.</button></div>
													<div class="select_list">
														<ul>
															<li><button type="button" value="5">매월 5일</button></li>
															<li><button type="button" value="10">매월 10일</button></li>
															<li><button type="button" value="15">매월 15일</button></li>
															<li><button type="button" value="20">매월 20일</button></li>
															<li><button type="button" value="25">매월 25일</button></li>
															<li><button type="button" value="30">매월 30일</button></li>
														</ul>
													</div>
												</div>
												<button type="button" class="field_btn blue2" data-pop-open="pop_schedule">상환스케줄 미리보기</button>
											</div>
										</div>
									</div>
								</div>
							</li>
						</ul>
					</div>

					<div class="field_btn_cont">
						<div class="field_btn_area page">
							<button type="button" class="field_btn blue" disabled>다음</button>
						</div>
					</div>
								</div>
							</section>
						</div>
					</div>
				</div>
				<!--// 컨텐츠 -->

			</div>
