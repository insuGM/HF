	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">

<body>
<div data-include="../inc/header.html"></div>

<div id="container">
	<div class="container_in">

		<!-- contents -->
		<div class="contents">
			<div class="sub_con hf_loan hfr">

				<!-- breadcrumb -->
				<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
					<ol class="breadcrumb">
						<li class="home"><a href="#" class="txt">홈</a></li>
						<li><a href="#" class="txt">주택담보대출</a></li>
						<li><a href="#" class="txt">대출 관리</a></li>
					</ol>
				</nav>
				<!--// breadcrumb -->

				<div class="title_set">
					<div class="page-title-wrap">
						<h2 class="h-tit">대출 계좌·상환 관리</h2>
					</div>

					<div class="title_etc_menu">
						<ul>
							<li class="print_li">
								<a href="#">
									<i class="svg-icon ico-down"></i>
									<span class="txt">뷰어 다운로드</span>
								</a>
							</li>
							<li class="print_li">
								<a href="#">
									<i class="svg-icon ico-print"></i>
									<span class="txt">인쇄</span>
								</a>
							</li>
						</ul>
					</div>
				</div>

				<!-- 컨텐츠 -->
				<div class="debt_cont">
					<div class="krds-tab-area tab_page layer list" id="tabLoanRepay">
						<div class="tab fill full line">
							<ul>
								<li data-listener-attached="true"><a href="#" class="btn-tab">실시간 상환신청</a></li>
								<li data-listener-attached="true"><a href="#" class="btn-tab">가상계좌상환 신청</a></li>
								<li data-listener-attached="true"><a href="#" class="btn-tab">자동이체 계좌 변경</a></li>
								<li class="active" data-listener-attached="true"><a href="#" class="btn-tab">대출상환일자 변경</a></li>
							</ul>
						</div>
						<div class="tab-conts-wrap type1">
							<section class="tab-conts active">
								<div class="debt_body">
					<div class="step_list_cont type1 step4">
						<ol class="krds-step-wrap">
						<li class="done">
							<span>
								<i class="step">1단계</i>
								<span class="step-tit">정보동의</span>
							</span>
						</li>
						<li class="done">
							<span>
								<i class="step">2단계</i>
								<span class="step-tit">납부일자 선택</span>
							</span>
						</li>
						<li class="active">
							<span>
								<em class="sr-only">현재단계</em>
								<i class="step">3단계</i>
								<span class="step-tit">변경내역 확인</span>
							</span>
						</li>
						<li>
							<span>
								<i class="step">4단계</i>
								<span class="step-tit">변경결과 확인</span>
							</span>
						</li>
						</ol>
					</div>

					<div class="step_cont m0">
						<span><span class="blue">3단계</span> / 4단계</span>
						<h3 class="page_step_tit">변경내역 확인</h3>
					</div>

					<div class="hf_info_field_cont">
						<ul class="list">
							<li>
								<div class="main_title_cont"><h4 class="title">변경 납부일자</h4></div>
								<div class="group_panel_row">
									<div class="group_panel">
										<div class="panel_title">변경 전 납부일자</div>
										<div class="dt_list">
											<div class="dl_text"><span class="tit">납부일자</span><span class="txt">매월 30일</span></div>
										</div>
									</div>
									<div class="group_panel on">
										<div class="panel_title">변경 후 납부일자</div>
										<div class="dt_list">
											<div class="dl_text"><span class="tit">납부일자</span><span class="txt">매월 30일</span></div>
											<div class="field_btn_cont m0">
												<div class="field_btn_area mid">
													<button type="button" class="field_btn black" data-pop-open="pop_schedule">상환스케줄 미리보기</button>
												</div>
											</div>
										</div>
									</div>
								</div>
							</li>
						</ul>
					</div>

					<div class="field_btn_cont">
						<div class="field_btn_area page">
							<button type="button" class="field_btn blue">납부일자변경 신청</button>
						</div>
					</div>
								</div>
							</section>
						</div>
					</div>
				</div>
				<!--// 컨텐츠 -->

			</div>
		</div>
		<!--// contents -->

	</div>
</div>

<!-- 퍼블리싱에서만 추가되는 스크립트 -->
