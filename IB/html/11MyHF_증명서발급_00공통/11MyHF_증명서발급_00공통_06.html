<!DOCTYPE html>
<html lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">
	<link rel="icon" href="data:;base64,iVBORw0KGgo=">

	<meta property="og:locale" content="ko">
	<meta property="og:site_name" content="한국주택금융공사">

	<title>한국주택금융공사</title>

	<link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
	<link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub3.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/hf_pup_style2.css">

	<!-- JavaScript 파일들 -->
	<script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>

	<script type="text/javascript" src="/resources/js/krds/krds.js"></script>
	<script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.custom.home.js"></script>
</head>
<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">
				<div class="sub_con hf_loan">

					<!-- breadcrumb -->
					<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
						<ol class="breadcrumb">
							<li class="home"><a href="#" class="txt">홈</a></li>
							<li><a href="#" class="txt">MyHF</a></li>
							<li><a href="#" class="txt">증명서 관리</a></li>
							<li><a href="#" class="txt">증명서 발급</a></li>
						</ol>
					</nav>
					<!--// breadcrumb -->

					<div class="title_set">
						<div class="page-title-wrap">
							<h2 class="h-tit">증명서 발급</h2>
						</div>

						<div class="title_etc_menu">
							<ul>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-down"></i>
										<span class="txt">뷰어 다운로드</span>
									</a>
								</li>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-print"></i>
										<span class="txt">인쇄</span>
									</a>
								</li>
							</ul>
						</div>
					</div>

					<!-- 컨텐츠 -->
					<div class="debt_cont">
						<div class="debt_body">
							<div class="hf_text_list_cont">
								<div class="hf-guide">
									<div class="hf-guide__head"><i class="svg-icon ico_guide_check" aria-hidden="true"></i><strong class="tit">증명서 발급 안내</strong></div>
									<div class="hf-guide__group">
										<ul class="krds-info-list decimal">
											<li>발급 받으실 증명서를 선택해 주세요.</li>
										</ul>
									</div>
								</div>
							</div>

							<div class="hf_info_field_cont myhf">
								<div class="exclamation myhf">
									<span class="text"><i class="svg-icon ico_exclamation" aria-hidden="true"></i>모든 입력항목은 필수입니다.</span>
								</div>
								<ul class="list">
									<li>
										<div class="main_title_cont">
											<h4 class="title">증명서 정보</h4>
										</div>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">발급 증명서</h5>
												</div>
												<div class="form-group select">
													<div class="form-conts myhf">
														<div class="inp_row">
															<div class="krds_select_box">
																<div class="select_tit"><button type="button" id="c06Biz"><span class="opt_txt">업무구분 선택</span></button></div>
																<div class="select_list">
																	<ul>
																		<li><button type="button" value="주택담보대출">주택담보대출</button></li>
																		<li><button type="button" value="학자금대출">학자금대출</button></li>
																		<li><button type="button" value="주택연금">주택연금</button></li>
																		<li><button type="button" value="주택보증">주택보증</button></li>
																		<li><button type="button" value="부채확인서 및 채무상환 확인서">부채확인서 및 채무상환 확인서</button></li>
																	</ul>
																</div>
															</div>
															<div class="krds_select_box">
																<div class="select_tit"><button type="button" id="c06Cert"><span class="opt_txt">증명서 선택</span></button></div>
																<div class="select_list">
																	<ul></ul>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</li>
								</ul>
							</div>

							<div class="field_btn_cont mt">
								<div class="field_btn_area page">
									<button type="button" class="field_btn blue myhf">발급</button>
								</div>
							</div>

							<div class="com_pop_cont active" id="c06PopPrivacy" role="dialog" aria-modal="true" aria-labelledby="c06PopPrivacy_tit">
								<div class="pop_cont_area pop_contract myhf">
									<div class="title_area">
										<h2 class="title" id="c06PopPrivacy_tit">보증잔액 확인서 발급</h2>
										<button type="button" class="close"><span class="sr-only">팝업 닫기</span></button>
									</div>
									<div class="pop_info_cont">
										<div class="form-group">
											<div class="sub_title_cont">
												<h5 class="title">개인정보 출력여부 (선택)</h5>
											</div>
											<div class="krds-check-area">
												<div class="krds-form-check"><input type="checkbox" name="c06Prv" id="c06Ord"><label for="c06Ord">주문등록번호를 전부 공개하여 발급</label></div>
											</div>
											<div class="krds-check-area">
												<div class="krds-form-check"><input type="checkbox" name="c06Prv" id="c06Loan"><label for="c06Loan">대출계좌를 전부 공개하여 발급</label></div>
											</div>
										</div>
										<div class="form-group">
											<div class="krds-check-area">
												<div class="krds-form-check"><input type="checkbox" name="c06Send" id="c06Fax" checked><label for="c06Fax">FAX</label></div>
											</div>
											<div class="form-conts">
												<div class="inp_row">
													<div class="krds_select_box">
														<div class="select_tit"><button type="button" id="c06FaxHead"><span class="opt_txt">선택</span></button></div>
														<div class="select_list">
															<ul></ul>
														</div>
													</div>
													<span class="hyphen" aria-hidden="true">-</span>
													<label for="c06Fax2" class="sr-only">FAX 번호 가운데 자리</label>
													<input type="text" id="c06Fax2" class="krds-input w16">
													<span class="hyphen" aria-hidden="true">-</span>
													<label for="c06Fax3" class="sr-only">FAX 번호 끝자리</label>
													<input type="text" id="c06Fax3" class="krds-input w16">
												</div>
											</div>
											<div class="field_btn_cont m0">
												<div class="table_top_area right">
													<button type="button" class="field_btn blue2 small">FAX 보내기</button>
												</div>
											</div>
										</div>
										<div class="form-group">
											<div class="krds-check-area">
												<div class="krds-form-check"><input type="checkbox" name="c06Send" id="c06Mail" checked><label for="c06Mail">E-mail</label></div>
											</div>
											<div class="form-conts">
												<div class="inp_row">
													<label for="c06MailId" class="sr-only">E-mail 아이디</label>
													<input type="text" id="c06MailId" class="krds-input w24">
													<span class="hyphen" aria-hidden="true">@</span>
													<div class="krds_select_box w24">
														<div class="select_tit"><button type="button" id="c06MailDomain"><span class="opt_txt">직접 입력</span></button></div>
														<div class="select_list">
															<ul></ul>
														</div>
													</div>
												</div>
											</div>
											<ul class="krds-info-list importance">
												<li class="small gray">수신메일에 첨부된 PDF파일 비밀번호는 신청인의 주민번호 앞 6자리로 설정되어 있습니다.</li>
											</ul>
											<div class="field_btn_cont m0">
												<div class="table_top_area right">
													<button type="button" class="field_btn blue2 small">E-mail 보내기</button>
												</div>
											</div>
										</div>
										<div class="krds-check-area">
											<div class="krds-form-check"><input type="checkbox" name="c06Send" id="c06Pdf"><label for="c06Pdf">PDF 직접 다운로드</label></div>
										</div>
										<div class="field_btn_cont">
											<div class="field_btn_area">
												<button type="button" class="field_btn black end small">취소</button>
												<button type="button" class="field_btn blue small">완료</button>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!--// 컨텐츠 -->

				</div>
			</div>
			<!--// contents -->

		</div>
	</div>

	<!-- 퍼블리싱에서만 추가되는 스크립트 -->
	<script type="text/javascript" src="/resources/js/include.js"></script>
	<!-- //퍼블리싱에서만 추가되는 스크립트 -->
</body>

</html>
