<!DOCTYPE html>

	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">

	<link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub3.css">

	<!-- JavaScript 파일들 -->
	<script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>

	<script type="text/javascript" src="/resources/js/krds/krds.js"></script>

<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">
				<div class="sub_con hf_loan">

					<!-- breadcrumb -->
					<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
						<ol class="breadcrumb">
							<li class="home"><a href="#" class="txt">홈</a></li>
							<li><a href="#" class="txt">MyHF</a></li>
							<li><a href="#" class="txt">증명서 관리</a></li>
							<li><a href="#" class="txt">증명서 발급</a></li>
						</ol>
					</nav>
					<!--// breadcrumb -->

					<div class="title_set">
						<div class="page-title-wrap">
							<h2 class="h-tit">증명서 발급</h2>
						</div>

						<div class="title_etc_menu">
							<ul>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-down"></i>
										<span class="txt">뷰어 다운로드</span>
									</a>
								</li>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-print"></i>
										<span class="txt">인쇄</span>
									</a>
								</li>
							</ul>
						</div>
					</div>

					<!-- 컨텐츠 -->
					<div class="debt_cont">
						<div class="debt_body">
							<button type="button" class="btn-help-panel expand btn-help-exec">입력 도움말<i class="svg-icon ico-angle left" aria-hidden="true"></i></button>

							<div class="hf_info_field_cont myhf">
								<div class="exclamation myhf">
									<span class="text"><i class="svg-icon ico_exclamation" aria-hidden="true"></i>모든 입력항목은 필수입니다.</span>
								</div>
								<ul class="list">
									<li>
										<div class="main_title_cont">
											<h4 class="title">증명서 정보</h4>
										</div>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c15Kind">발급 증명서</label></h5>
												</div>
												<div class="form-group select">
													<div class="form-conts myhf">
														<div class="inp_row">
															<div class="krds_select_box">
																<div class="select_tit"><button type="button" class="selected" id="c15Kind"><span class="opt_txt">주택담보대출</span></button></div>
																<div class="select_list">
																	<ul>
																		<li><button type="button" value="주택담보대출">주택담보대출</button></li>
																	</ul>
																</div>
															</div>
															<div class="krds_select_box">
																<div class="select_tit"><button type="button" class="selected" id="c15Cert"><span class="sr-only">증명서 종류</span><span class="opt_txt">대출승인내역확인서</span></button></div>
																<div class="select_list">
																	<ul>
																		<li><button type="button" value="대출승인내역확인서">대출승인내역확인서</button></li>
																	</ul>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</li>
									<li>
										<div class="main_title_cont">
											<h4 class="title">추가 정보<button type="button" class="help" title="도움말 보기"><i class="svg-icon ico_help" aria-hidden="true"></i></button></h4>
										</div>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c15Cfm">확약 번호</label></h5>
												</div>
												<div class="form-group select">
													<div class="form-conts myhf">
														<div class="krds_select_box">
															<div class="select_tit"><button type="button" id="c15Cfm"><span class="opt_txt">확약 번호 선택</span></button></div>
															<div class="select_list">
																<ul>
																	<li><button type="button" value="확약 번호 선택">확약 번호 선택</button></li>
																</ul>
															</div>
														</div>
													</div>
												</div>
											</div>

											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c15Rsc">발급사유</label></h5>
												</div>
												<div class="form-group select">
													<div class="form-conts myhf">
														<div class="krds_select_box">
															<div class="select_tit"><button type="button" class="selected" id="c15Rsc"><span class="opt_txt">기타</span></button></div>
															<div class="select_list">
																<ul>
																	<li><button type="button" value="기타">기타</button></li>
																</ul>
															</div>
														</div>
													</div>
												</div>
											</div>

											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c15Rsn">사유 입력</label></h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<div class="textarea-wrap">
															<textarea id="c15Rsn" class="krds-input" placeholder="내용을 입력하세요" maxlength="100"></textarea>
															<div class="textarea-count"><span class="count-now">1</span>/100</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</li>
								</ul>
							</div>

							<div class="field_btn_cont mt">
								<div class="field_btn_area page">
									<button type="button" class="field_btn blue myhf">발급</button>
								</div>
							</div>
						</div>
					</div>
					<!--// 컨텐츠 -->

				</div>
			</div>
			<!--// contents -->

		</div>
	</div>

	<div class="krds-help-panel expand myhf">
		<div class="help-panel-wrap">
			<div class="help-conts-area">
				<button type="button" class="btn-help-panel fold">접어두기<i class="svg-icon ico-angle right" aria-hidden="true"></i></button>
				<div class="help-conts-area-inner">
					<div class="conts-area help-conts">
						<h3 class="help-title">입력 도움말</h3>
						<div class="conts-wrap">
							<p class="help-desc">물음표를 누르면 항목별 설명을 볼 수 있습니다.</p>
							<div class="hf-panel-accordion">
								<div class="hf-panel-accordion__item">
									<h4><button type="button" id="c15Pnl" class="hf-panel-accordion__btn" aria-expanded="true" aria-controls="c15PnlC">대출승인내역확인서 발급 안내<i class="svg-icon ico-angle up" aria-hidden="true"></i></button></h4>
									<div id="c15PnlC" class="hf-panel-accordion__body">
										<div class="hf-explain-box small">
											<ul class="krds-info-list decimal">
												<li>24.1.30 이후 신청 건은 대출승인내역확인서 발급 불가(특례보금자리론/서민형안심전환대출만 가능)</li>
											</ul>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 퍼블리싱에서만 추가되는 스크립트 -->
	<script type="text/javascript" src="/resources/js/include.js"></script>
	<!-- //퍼블리싱에서만 추가되는 스크립트 -->

</html>
