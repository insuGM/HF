	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">

<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">
				<div class="sub_con hf_loan">

					<!-- breadcrumb -->
					<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
						<ol class="breadcrumb">
							<li class="home"><a href="#" class="txt">홈</a></li>
							<li><a href="#" class="txt">MyHF</a></li>
							<li><a href="#" class="txt">증명서 관리</a></li>
							<li><a href="#" class="txt">증명서 발급</a></li>
						</ol>
					</nav>
					<!--// breadcrumb -->

					<div class="title_set">
						<div class="page-title-wrap">
							<h2 class="h-tit">증명서 발급</h2>
						</div>

						<div class="title_etc_menu">
							<ul>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-down"></i>
										<span class="txt">뷰어 다운로드</span>
									</a>
								</li>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-print"></i>
										<span class="txt">인쇄</span>
									</a>
								</li>
							</ul>
						</div>
					</div>

					<!-- 컨텐츠 -->
					<div class="debt_cont">
						<div class="debt_body">
							<div class="hf_info_field_cont myhf">
								<div class="exclamation myhf">
									<span class="text"><i class="svg-icon ico_exclamation" aria-hidden="true"></i>모든 입력항목은 필수입니다.</span>
								</div>
								<ul class="list">
									<li>
										<div class="main_title_cont">
											<h4 class="title">증명서 정보</h4>
										</div>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c17Kind">발급 증명서</label></h5>
												</div>
												<div class="form-group select">
													<div class="form-conts myhf">
														<div class="inp_row">
															<div class="krds_select_box">
																<div class="select_tit"><button type="button" class="selected" id="c17Kind"><span class="opt_txt">주택담보대출</span></button></div>
																<div class="select_list">
																	<ul>
																		<li><button type="button" value="주택담보대출">주택담보대출</button></li>
																	</ul>
																</div>
															</div>
															<div class="krds_select_box">
																<div class="select_tit"><button type="button" class="selected" id="c17Cert"><span class="sr-only">증명서 종류</span><span class="opt_txt">영문 부채증명서</span></button></div>
																<div class="select_list">
																	<ul>
																		<li><button type="button" value="영문 부채증명서">영문 부채증명서</button></li>
																	</ul>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</li>
									<li>
										<div class="main_title_cont">
											<h4 class="title">추가 정보</h4>
										</div>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c17Rsc">발급사유</label></h5>
												</div>
												<div class="form-group select">
													<div class="form-conts myhf">
														<div class="krds_select_box">
															<div class="select_tit"><button type="button" class="selected" id="c17Rsc"><span class="opt_txt">기타</span></button></div>
															<div class="select_list">
																<ul>
																	<li><button type="button" value="기타">기타</button></li>
																</ul>
															</div>
														</div>
													</div>
												</div>
											</div>

											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c17Rsn">사유 입력</label></h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<div class="textarea-wrap">
															<textarea id="c17Rsn" class="krds-input" placeholder="내용을 입력하세요" maxlength="100"></textarea>
															<div class="textarea-count"><span class="count-now">1</span>/100</div>
														</div>
													</div>
												</div>
											</div>

											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c17EnNm">영문 이름</label></h5>
												</div>
												<div class="form-group">
													<div class="form-conts down myhf">
														<input type="text" class="krds-input" id="c17EnNm" placeholder="입력해 주세요">
													</div>
												</div>
											</div>

											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="c17EnAd">영문 주소</label></h5>
												</div>
												<div class="form-group">
													<div class="form-conts area">
														<div class="area_box">
															<input type="text" class="krds-input" id="c17EnAd" value="영문 주소" disabled>
															<button type="button" class="field_btn blue2 myhf w18">행안부 도로명 주소</button>
														</div>
													</div>
												</div>
											</div>
										</div>
									</li>
								</ul>
							</div>

							<div class="field_btn_cont mt">
								<div class="field_btn_area page">
									<button type="button" class="field_btn blue myhf">발급</button>
								</div>
							</div>
						</div>
					</div>
					<!--// 컨텐츠 -->

				</div>
			</div>
