	<title>한국주택금융공사</title>

<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">

				<div class="sub_con">
					<!-- sub_title -->
					<div class="sub_title">
						<div class="sub_title_in">
							<!-- breadcrumb -->
							<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
								<ol class="breadcrumb">
									<li class="home"><a href="#" class="txt">홈</a></li>
									<li><a href="#" class="txt">서비스 신청</a></li>
									<li><a href="#" class="txt">서비스 신청2</a></li>
								</ol>
							</nav>
						</div>
					</div>
					<!-- //sub_title -->

					<div class="user-register">
						<div class="container">
							<div class="page-title-wrap">
								<h1 class="h-tit">사용자 등록</h1>
							</div>
							<!-- 2단계: 본인확인 -->
							<ol class="krds-step-wrap li3">
								<li class="done">
									<span>
										<i class="step">1단계</i>
										<span class="step-tit">약관·정보제공 동의</span>
									</span>
								</li>
								<li class="active">
									<span>
										<i class="step">2단계</i>
										<span class="step-tit">본인확인</span>
										<span class="sr-only">현재단계</span>
									</span>
								</li>
								<li>
									<span>
										<i class="step">3단계</i>
										<span class="step-tit">사용자 등록</span>
									</span>
								</li>
							</ol>
							<div class="total-step">
								<ul>
									<li class="on">2단계</li>
									<li>/ 3단계</li>
								</ul>
							</div>
							<p class="sub-tit">본인확인</p>
							<div class="login-auth-panels">
								<p class="title">본인확인 수단</p>
								<ul>
									<li class="type2">
										<button type="button">
											<div class="inner">
												<p>간편인증<span class="m-hide">(민간인증서)</span></p>
												<span>KB국민인증서, 카카오뱅크 간편인증 사용</span>
											</div>
										</button>
									</li>
									<li class="type7">
										<button type="button">
											<div class="inner">
												<p>휴대폰 본인확인</p>
												<span>본인명의 휴대폰으로 본인확인</span>
											</div>
										</button>
									</li>
									<li class="type8">
										<button type="button">
											<div class="inner">
												<p>카드 본인확인</p>
												<span>본인명의 신용카드로 본인확인</span>
											</div>
										</button>
									</li>
									<li class="type9">
										<button type="button">
											<div class="inner">
												<p>대체인증</p>
												<span>공사상품을 이용중인 고객중 본인명의 휴대전화를 미소지한 경우</span>
											</div>
										</button>
									</li>
								</ul>
							</div>
							<div class="btn-wrap left">
								<ul>
									<li>
										<a href="/html/user/user_type1/user-register01_01.html" class="krds-btn tertiary col2"><span>이전</span></a>
									</li>
									<li>
										<a href="/html/user/user_type1/user-register02.html" class="krds-btn col1"><span>취소</span></a>
									</li>
								</ul>
							</div>
						</div>
						<!-- 대체인증 활성화 팝업 -->
						<div class="com_pop_cont type1 active">
							<div class="pop_cont_area pop10">
								<div class="title_area">
									<div class="title">공사고객 본인확인</div>
									<button type="button" class="close"></button>
								</div>
								<div class="pop_info_cont">
									<div class="inner-box identityAuth">
										<p class="top-exp-txt ic1">본인확인 대체인증</p>
										<div class="form-group">
											<div class="form-conts">
												<div class="krds-check-area">
													<div class="krds-form-check">
														<input type="checkbox" name="chk_1" id="chk_1">
														<label for="chk_1">본 대체인증은 공사 상품을 이용하는 고객에 한하여 사용가능합니다.</label>
													</div>
													<div class="krds-form-check">
														<input type="checkbox" name="chk_2" id="chk_2">
														<label for="chk_2">본 대체인증을 사용한 경우 연계정보(CI)를 수집할 수 없어 간편인증 등의 서비스에 제약이 발생할 수 있으니 유의하시기 바랍니다.</label>
													</div>
												</div>
											</div>
										</div>
										<div class="write-form-box">
											<ul>
												<li class="write-form">
													<div class="conts-box">
														<div class="inner">
															<div class="form-wrap">
																<ul>
																	<li>
																		<div class="form-item">
																			<div class="form-group">
																				<div class="form-tit">
																					<label>공사 고객번호<span>(필수)</span></label>
																				</div>
																				<div class="form-conts">
																					<input type="text" readonly="" placeholder="공사 고객번호">
																				</div>
																			</div>
																		</div>
																	</li>
																</ul>
															</div>
														</div>
													</div>
												</li>
											</ul>
										</div>
										<div class="btn-wrap right">
											<ul>
												<li>
													<button type="button" class="krds-btn col3 no-ic end"><span>확인</span></button>
												</li>
											</ul>
										</div>
									</div>
								</div>
							</div>
						</div>

					</div>
				</div>
			</div>
		</div>
