<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">

				<div class="sub_con">
					<!-- sub_title -->
					<div class="sub_title">
						<div class="sub_title_in">
							<!-- breadcrumb -->
							<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
								<ol class="breadcrumb">
									<li class="home"><a href="#" class="txt">홈</a></li>
									<li><a href="#" class="txt">서비스 신청</a></li>
									<li><a href="#" class="txt">서비스 신청2</a></li>
								</ol>
							</nav>
						</div>
					</div>
					<!-- //sub_title -->

					<div class="user-register">
						<div class="container">
							<div class="page-title-wrap">
								<h1 class="h-tit">사용자 등록</h1>
							</div>
							<!-- 2단계: 본인확인 -->
							<ol class="krds-step-wrap li4">
								<li class="done">
									<span>
										<i class="step">1단계</i>
										<span class="step-tit">약관·정보제공 동의</span>
									</span>
								</li>
								<li class="done">
									<span>
										<i class="step">2단계</i>
										<span class="step-tit">본인확인</span>
									</span>
								</li>
								<li class="active">
									<span>
										<i class="step">3단계</i>
										<span class="step-tit">실명확인</span>
										<span class="sr-only">현재단계</span>
									</span>
								</li>
							</ol>
							<div class="total-step">
								<ul>
									<li class="on">3단계</li>
									<li>/ 3단계</li>
								</ul>
							</div>
							<p class="sub-tit">사용자 등록</p>
							<div class="write-form-box">
								<ul>
									<li class="write-form">
										<div class="conts-box">
											<div class="inner">
												<p class="title">사용자 실명확인</p>
												<div class="form-wrap">
													<ul>
														<li>
															<div class="form-item">
																<div class="form-group">
																	<div class="form-tit">
																		<label>성명<span>(필수)</span></label>
																	</div>
																	<div class="form-conts">
																		<input type="text" placeholder="입력해 주세요.">
																	</div>
																</div>
															</div>
														</li>
														<li>
															<div class="form-item reg-num">
																<div class="form-group">
																	<div class="form-tit">
																		<label>주민등록번호/외국인등록번호<span>(필수)</span></label>
																	</div>
																	<div class="form-conts-wrap">
																		<div class="inp-box">
																			<div class="form-tit">
																				<label class="sub_tit">주민등록번호 앞번호</label>
																			</div>
																			<div class="form-conts">
																				<input type="text" placeholder="입력해 주세요.">
																			</div>
																		</div>
																		<span class="hyphen">-</span>
																		<div class="inp-box">
																			<div class="form-tit">
																				<label class="sub_tit">주민등록번호 뒷번호</label>
																			</div>
																			<div class="form-conts">
																				<input type="text" placeholder="입력해 주세요.">
																			</div>
																		</div>
																	</div>
																</div>
															</div>
														</li>
														<li>
															<div class="form-item reg-num">
																<div class="form-group">
																	<div class="form-tit">
																		<label>휴대전화번호<span>(필수)</span></label>
																	</div>
																	<div class="form-conts">
																		<input type="text" placeholder="입력해 주세요.">
																	</div>
																</div>
															</div>
														</li>
														<li class="auth">
															<div class="login-auth-panels li2">
																<ul>
																	<li class="type3">
																		<button type="button">
																			<div class="inner">
																				<p>공동·금융인증서 실명확인</p>
																				<span>금융기관에서 제공하는 공동 또는 금융인증서로 로그인하기</span>
																			</div>
																		</button>
																	</li>
																	<li class="type1">
																		<button type="button">
																			<div class="inner">
																				<p>모바일 신분증 실명확인</p>
																				<span>공사상품을 이용중인 고객중 본인명의 휴대전화를 미소지한 경우</span>
																			</div>
																		</button>
																	</li>
																</ul>
															</div>
														</li>
													</ul>
												</div>
											</div>
										</div>
									</li>
								</ul>
							</div>
							<div class="btn-wrap left">
								<ul>
									<li>
										<button type="button" class="krds-btn tertiary col2"><span>이전</span></button>
									</li>
									<li>
										<button type="button" class="krds-btn col3"><span>등록</span></button>
									</li>
								</ul>
							</div>
						</div>
					</div>
