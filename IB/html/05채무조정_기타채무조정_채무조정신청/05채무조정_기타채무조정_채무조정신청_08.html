<!DOCTYPE html>
<html lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">
	<link rel="icon" href="data:;base64,iVBORw0KGgo=">
	<meta property="og:type" content="website">
	<meta property="og:locale" content="ko">
	<meta property="og:site_name" content="한국주택금융공사">
	<meta property="og:updated_time" content="">
	<meta name="twitter:card" content="summary">
	<title>한국주택금융공사</title>

	<link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
	<link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub3.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/hf_pup_style2.css">

	<!-- JavaScript 파일들 -->
	<script type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>

	<script type="text/javascript" src="/resources/js/krds/krds.js"></script>
	<script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.custom.home.js"></script>
</head>
<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">

				<div class="sub_con">

					<!-- breadcrumb -->
					<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
						<ol class="breadcrumb">
							<li class="home"><a href="#" class="txt">홈</a></li>
							<li><a href="#" class="txt">채무조정</a></li>
							<li><a href="#" class="txt">채무조정 신청</a></li>
						</ol>
					</nav>
					<!--// breadcrumb -->

					<div class="title_set">
						<div class="page-title-wrap">
							<h2 class="h-tit">주택담보대출 채무조정</h2>
						</div>

						<div class="title_etc_menu">
							<ul>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-down"></i>
										<span class="txt">뷰어 다운로드</span>
									</a>
								</li>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-print"></i>
										<span class="txt">인쇄</span>
									</a>
								</li>
							</ul>
						</div>
					</div>

					<!-- 컨텐츠 -->
					<div class="debt_cont">
						<div class="krds-tab-area tab_page layer list" id="tabDebtType">
							<div class="tab fill full line">
								<ul>
									<li>
										<a href="#" class="btn-tab">원금상환 유예 신청</a>
									</li>
									<li>
										<a href="#" class="btn-tab">지연배상금 감면 신청</a>
									</li>
									<li>
										<a href="#" class="btn-tab">캠코양도형 채무조정</a>
									</li>
									<li class="active">
										<a href="#" class="btn-tab">기타 채무조정(보증, 학자금 등)</a>
									</li>
								</ul>
							</div>
							<div class="tab-conts-wrap type1">
								<section class="tab-conts active">

									<div class="step_list_cont type1 step4">
										<ol class="krds-step-wrap">
											<li class="done">
												<span>
													<i class="step">1단계</i>
													<span class="step-tit">채무내역 및 상환계획</span>
												</span>
											</li>
											<li class="done">
												<span>
													<i class="step">2단계</i>
													<span class="step-tit">신청동의</span>
												</span>
											</li>
											<li class="active">
												<span>
													<em class="sr-only">현재단계</em>
													<i class="step">3단계</i>
													<span class="step-tit">신청서 작성</span>
												</span>
											</li>
											<li>
												<span>
													<i class="step">4단계</i>
													<span class="step-tit">신청확인</span>
												</span>
											</li>
										</ol>
									</div>

									<div class="step_cont">
										<span><span class="blue">3단계</span> / 4단계</span>
										<h3 class="title">신청서 작성</h3>
									</div>

									<div class="debt_body">

										<div class="hf_info_field_cont info_block_cont">
											<div class="exclamation">
												<div class="text"><i class="svg-icon ico_exclamation" aria-hidden="true"></i>모든 입력항목은 필수입니다.</div>
											</div>
											<ul class="list">
												<li>
													<div class="main_title_cont m0">
														<h4 class="title">개인정보 입력</h4>
													</div>
													<div class="fieldset">
														<div class="hf_group">
															<div class="sub_title_cont">
																<h5 class="title">주민등록번호</h5>
															</div>
															<div class="form-group">
																<div class="form-conts">
																	<label for="inp_jumin1" class="sr-only">주민등록번호 앞 6자리</label>
																	<input type="text" id="inp_jumin1" class="krds-input" value="790301" title="주민등록번호 앞 6자리" readonly>
																	<div class="form-conts btn-ico-wrap">
																		<label for="inp_jumin2" class="sr-only">주민등록번호 뒤 7자리</label>
																		<input type="text" id="inp_jumin2" class="krds-input pw_mouse" value="1••••••" title="주민등록번호 뒤 7자리" readonly>
																		<button type="button" class="krds-btn medium icon">
																			<span class="sr-only">입력한 주민등록번호 가리기</span>
																			<i class="svg-icon ico_pw_mouse" aria-hidden="true"></i>
																		</button>
																	</div>
																</div>
															</div>
														</div>
														<div class="hf_group">
															<div class="sub_title_cont">
																<h5 class="title">주소</h5>
															</div>
															<div class="form-group">
																<div class="form-conts area">
																	<div class="area_box">
																		<label for="inp_zip" class="sr-only">우편번호</label>
																		<input type="text" id="inp_zip" class="krds-input inp_view" title="우편번호" readonly>
																		<button type="button" class="field_btn black">주소검색</button>
																	</div>
																	<label for="inp_addr1" class="sr-only">주소</label>
																	<input type="text" id="inp_addr1" class="krds-input inp_view" placeholder="주소 검색 버튼을 눌러주세요." title="주소" readonly>
																	<label for="inp_addr2" class="sr-only">상세주소</label>
																	<input type="text" id="inp_addr2" class="krds-input" placeholder="상세주소를 입력해 주세요" title="상세주소">
																</div>
															</div>
														</div>
														<div class="hf_group">
															<div class="sub_title_cont">
																<h5 class="title">휴대전화</h5>
															</div>
															<div class="form-group">
																<div class="form-conts">
																	<label for="inp_mobile" class="sr-only">휴대전화</label>
																	<input type="text" id="inp_mobile" class="krds-input" placeholder="입력해 주세요" title="휴대전화">
																</div>
															</div>
														</div>
														<div class="hf_group">
															<div class="sub_title_cont">
																<h5 class="title">전화번호</h5>
															</div>
															<div class="form-group">
																<div class="form-conts">
																	<label for="inp_tel" class="sr-only">전화번호</label>
																	<input type="text" id="inp_tel" class="krds-input" placeholder="입력해 주세요" title="전화번호">
																</div>
															</div>
														</div>
														<div class="hf_group">
															<div class="sub_title_cont">
																<h5 class="title">이메일</h5>
															</div>
															<div class="form-group">
																<div class="form-conts">
																	<label for="inp_email" class="sr-only">이메일</label>
																	<input type="text" id="inp_email" class="krds-input" placeholder="입력해 주세요" title="이메일">
																</div>
															</div>
														</div>
													</div>
												</li>
											</ul>
										</div>

										<div class="consent_chk_cont">
											<div class="consent_all_chk_area type_left">
												<div class="krds-check-area">
													<div class="krds-form-check medium">
														<input type="checkbox" name="chk_final" id="chk_final">
														<label for="chk_final">본인은 위의 내용을 모두 이해하였으며, 위와 같이 채무의 조정을 신청합니다</label>
													</div>
												</div>
											</div>
										</div>

									</div>

									<div class="field_btn_cont">
										<div class="field_btn_area page">
											<a href="#" class="field_btn black">이전</a>
											<button type="button" class="field_btn blue" disabled>다음</button>
										</div>
									</div>

								</section>
							</div>
						</div>
					</div>
					<!--// 컨텐츠 -->

				</div>
			</div>
		</div>
	</div>

	<!-- 퍼블리싱에서만 추가되는 스크립트 -->
	<script type="text/javascript" src="/resources/js/include.js"></script>
	<!-- //퍼블리싱에서만 추가되는 스크립트 -->
</body>

</html>
