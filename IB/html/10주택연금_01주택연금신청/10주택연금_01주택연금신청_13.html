<!DOCTYPE html>
<html lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">
	<link rel="icon" href="data:;base64,iVBORw0KGgo=">
	<meta property="og:type" content="website">
	<meta property="og:locale" content="ko">
	<meta property="og:site_name" content="한국주택금융공사">
	<meta name="twitter:card" content="summary">
	<title>한국주택금융공사</title>

	<link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
	<link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub3.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/hf_pup_style2.css">

	<script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.js"></script>
	<script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.custom.home.js"></script>
</head>
<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">
				<div class="sub_con hf_loan">

					<!-- breadcrumb -->
					<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
						<ol class="breadcrumb">
							<li class="home"><a href="#" class="txt">홈</a></li>
							<li><a href="#" class="txt">주택연금</a></li>
							<li><a href="#" class="txt">주택연금 신청</a></li>
						</ol>
					</nav>
					<!--// breadcrumb -->

					<div class="title_set">
						<div class="page-title-wrap">
							<h2 class="h-tit">주택연금 신청</h2>
						</div>

						<div class="title_etc_menu">
							<ul>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-down"></i>
										<span class="txt">뷰어 다운로드</span>
									</a>
								</li>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-print"></i>
										<span class="txt">인쇄</span>
									</a>
								</li>
							</ul>
						</div>
					</div>

					<!-- 컨텐츠 -->
					<div class="debt_cont">
						<div class="debt_body hfp">

							<div class="step_list_cont type1 step8 hfp">
								<ol class="krds-step-wrap">
									<li class="done"><span><em class="sr-only">완료</em><i class="step">1단계</i><span class="step-tit">신청 방법 선택</span></span></li>
									<li class="done"><span><em class="sr-only">완료</em><i class="step">2단계</i><span class="step-tit">정보제공동의</span></span></li>
									<li class="done"><span><em class="sr-only">완료</em><i class="step">3단계</i><span class="step-tit">스마트서류제출</span></span></li>
									<li class="done"><span><em class="sr-only">완료</em><i class="step">4단계</i><span class="step-tit">설명사항 확인</span></span></li>
									<li class="active"><span><em class="sr-only">현재단계</em><i class="step">5단계</i><span class="step-tit">인적사항</span></span></li>
									<li><span><i class="step">6단계</i><span class="step-tit">대상 담보주택 정보</span></span></li>
									<li><span><i class="step">7단계</i><span class="step-tit">신청내용</span></span></li>
									<li><span><i class="step">8단계</i><span class="step-tit">신청정보확인</span></span></li>
								</ol>
							</div>

							<div class="step_cont">
								<span><span class="blue">5단계</span> / 8단계</span>
								<h3 class="title">인적사항</h3>
							</div>

							<div class="hf_info_field_cont">
								<div class="exclamation"><span class="text"><i class="svg-icon ico_exclamation" aria-hidden="true"></i>모든 입력항목은 필수입니다.</span></div>
								<ul class="list">
									<li>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">휴대전화</h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<div class="form-inp"><input type="text" class="krds-input" id="p13_mobile" title="휴대전화" placeholder="‘-’ 없이 입력해 주세요"></div>
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">자택전화</h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<div class="form-inp"><input type="text" class="krds-input" id="p13_tel" title="자택전화" placeholder="‘-’ 없이 입력해 주세요"></div>
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">주소</h5>
												</div>
												<div class="form-group">
													<div class="form-conts area">
														<div class="area_box">
															<input type="text" class="krds-input" id="p13_addr" title="주소" placeholder="주소 검색 버튼을 눌러주세요" readonly>
															<button type="button" class="field_btn blue2">주소 검색</button>
														</div>
														<input type="text" class="krds-input" id="p13_addr_d" title="주소 상세주소" placeholder="상세주소를 입력해 주세요." readonly>
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">이메일</h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<div class="form-inp"><input type="text" class="krds-input" id="p13_email" title="이메일" placeholder="입력해 주세요"></div>
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">상담 동기</h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<div class="krds_select_box" id="p13_motive">
															<div class="select_tit"><button type="button" id="p13_motive_btn">선택해 주세요</button></div>
															<div class="select_list">
																<ul>
																	<li><button type="button">금융기관(주택담보대출상환)</button></li>
																	<li><button type="button">국민연금공단연계</button></li>
																	<li><button type="button">재가입</button></li>
																	<li><button type="button">공사홍보</button></li>
																	<li><button type="button">신문/방송 등</button></li>
																	<li><button type="button">금융회사</button></li>
																	<li><button type="button">자녀 권유</button></li>
																	<li><button type="button">기 이용자 권유</button></li>
																	<li><button type="button">공사 직원 추천</button></li>
																	<li><button type="button">노인복지관 등</button></li>
																	<li><button type="button">명예홍보대사(미이용자)</button></li>
																	<li><button type="button">주택연금 전환(가교형 주택연금)</button></li>
																	<li><button type="button">은퇴금융아카데미</button></li>
																	<li><button type="button">기타</button></li>
																</ul>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</li>
								</ul>
							</div>

							<div class="field_btn_cont">
								<div class="field_btn_area page">
									<button type="button" class="field_btn black">이전</button>
									<a href="#" class="field_btn blue">다음</a>
								</div>
							</div>

						</div>
					</div>
					<!--// 컨텐츠 -->

				</div>
			</div>
			<!--// contents -->

		</div>
	</div>

	<script type="text/javascript" src="/resources/js/include.js"></script>
</body>
</html>
