<!DOCTYPE html>
<html lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">

	<title>한국주택금융공사</title>

	<link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
	<link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub3.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/hf_pup_style2.css">

	<!-- JavaScript 파일들 -->
	<script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>

	<script type="text/javascript" src="/resources/js/krds/krds.js"></script>
	<script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.custom.home.js"></script>
</head>
<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">
				<div class="sub_con hf_loan">

					<!-- breadcrumb -->
					<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
						<ol class="breadcrumb">
							<li class="home"><a href="#" class="txt">홈</a></li>
							<li><a href="#" class="txt">MyHF</a></li>
							<li><a href="#" class="txt">마이페이지</a></li>
							<li><a href="#" class="txt">MY 정보관리</a></li>
						</ol>
					</nav>
					<!--// breadcrumb -->

					<div class="title_set">
						<div class="page-title-wrap">
							<h2 class="h-tit">MY 정보관리</h2>
						</div>

						<div class="title_etc_menu">
							<ul>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-down"></i>
										<span class="txt">뷰어 다운로드</span>
									</a>
								</li>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-print"></i>
										<span class="txt">인쇄</span>
									</a>
								</li>
							</ul>
						</div>
					</div>

					<!-- 컨텐츠 -->
					<div class="debt_cont">
						<div class="debt_body">
							<div class="hf_info_field_cont myhf">
								<div class="exclamation myhf">
									<span class="text"><i class="svg-icon ico_exclamation" aria-hidden="true"></i>모든 입력항목은 필수입니다.</span>
								</div>
								<ul class="list">
									<li>
										<div class="main_title_cont">
											<h4 class="title">기본정보</h4>
										</div>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="m04Addr1">주소</label></h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<button type="button" class="field_btn blue2 small myhf">주소검색</button>
													</div>
													<div class="form-conts">
														<input type="text" id="m04Addr1" class="krds-input" placeholder="주소 검색 버튼을 눌러주세요." readonly>
													</div>
													<div class="form-conts">
														<input type="text" id="m04Addr2" class="krds-input" title="상세주소" placeholder="상세주소를 입력해 주세요">
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="m04Mobile">휴대전화</label></h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<input type="tel" id="m04Mobile" class="krds-input" placeholder="010-1234-5678">
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="m04Tel">전화번호</label></h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<input type="tel" id="m04Tel" class="krds-input" placeholder="입력해 주세요">
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title"><label for="m04Email">이메일</label></h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<input type="email" id="m04Email" class="krds-input" placeholder="입력해 주세요">
													</div>
												</div>
											</div>
										</div>
									</li>
								</ul>
							</div>

							<div class="hf_info_field_cont myhf">
								<ul class="list">
									<li>
										<div class="main_title_cont">
											<h4 class="title">수신여부</h4>
										</div>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">주택담보대출 수신여부 <button type="button" class="help" title="도움말 보기"><i class="svg-icon ico_help" aria-hidden="true"></i></button></h5>
												</div>
												<div class="form-group">
													<div class="dt_list in_box">
														<div class="dl_text"><span class="tit">문자메시지</span><span class="txt tar"><span class="krds-form-toggle-switch"><input type="checkbox" id="m04SmsDay" checked><label for="m04SmsDay"><span class="switch-toggle"><i></i></span>납부일자</label></span> <span class="krds-form-toggle-switch"><input type="checkbox" id="m04SmsAmt" checked><label for="m04SmsAmt"><span class="switch-toggle"><i></i></span>납부금액</label></span></span></div>
														<div class="dl_text"><span class="tit">카카오 알림톡</span><span class="txt tar"><span class="krds-form-toggle-switch"><input type="checkbox" id="m04KkoDay" checked><label for="m04KkoDay"><span class="switch-toggle"><i></i></span>납부일자</label></span> <span class="krds-form-toggle-switch"><input type="checkbox" id="m04KkoAmt" checked><label for="m04KkoAmt"><span class="switch-toggle"><i></i></span>납부금액</label></span></span></div>
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">주택보증 수신여부 <button type="button" class="help" title="도움말 보기"><i class="svg-icon ico_help" aria-hidden="true"></i></button></h5>
												</div>
												<div class="form-group">
													<div class="dt_list in_box">
														<div class="dl_text"><span class="tit">문자메시지</span><span class="txt tar"><span class="krds-form-toggle-switch"><input type="checkbox" id="m04GuaSms" checked><label for="m04GuaSms"><span class="switch-toggle"><i></i></span><span class="sr-only">주택보증 문자메시지 수신</span></label></span></span></div>
														<div class="dl_text"><span class="tit">우편(DM)</span><span class="txt tar"><span class="krds-form-toggle-switch"><input type="checkbox" id="m04GuaDm" checked><label for="m04GuaDm"><span class="switch-toggle"><i></i></span><span class="sr-only">주택보증 우편(DM) 수신</span></label></span></span></div>
													</div>
												</div>
											</div>
										</div>
									</li>
								</ul>
							</div>

							<div class="hf_info_field_cont myhf">
								<ul class="list">
									<li>
										<div class="main_title_cont m0">
											<h4 class="title"><span class="tit">금융서비스 등록해지 <button type="button" class="help" title="도움말 보기"><i class="svg-icon ico_help" aria-hidden="true"></i></button></span><span class="btn_right"><button type="button" class="field_btn blue2 small myhf">등록해지</button></span></h4>
										</div>
									</li>
								</ul>
							</div>

							<div class="field_btn_cont mt">
								<div class="field_btn_area page">
									<button type="button" class="field_btn blue myhf">저장</button>
								</div>
							</div>
						</div>
					</div>
					<!--// 컨텐츠 -->

				</div>
			</div>
			<!--// contents -->

		</div>
	</div>

	<div class="com_pop_cont active" id="mPopDone" role="dialog" aria-modal="true" aria-labelledby="mPopDone_tit">
		<div class="pop_cont_area pop_alert type2 myhf">
			<div class="title_area">
				<h2 class="title" id="mPopDone_tit">알림</h2>
				<button type="button" class="close"><span class="sr-only">팝업 닫기</span></button>
			</div>
			<div class="pop_info_cont">
				<div class="title_area">
					<div class="text">정보 변경이 정상적으로 완료되었습니다.</div>
				</div>
				<div class="field_btn_cont w100">
					<div class="field_btn_area">
						<button type="button" class="field_btn blue small">확인</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 퍼블리싱에서만 추가되는 스크립트 -->
	<script type="text/javascript" src="/resources/js/include.js"></script>
	<!-- //퍼블리싱에서만 추가되는 스크립트 -->
</body>

</html>
