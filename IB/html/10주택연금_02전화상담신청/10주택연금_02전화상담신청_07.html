<!DOCTYPE html>
<html lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">

	<meta property="og:locale" content="ko">
	<meta property="og:site_name" content="한국주택금융공사">
	<meta name="twitter:card" content="summary">
	<title>한국주택금융공사</title>

	<link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
	<link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub3.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/hf_pup_style2.css">

	<script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.js"></script>
	<script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.custom.home.js"></script>
</head>
<body>
	<div data-include="../inc/header.html"></div>

	<div id="container">
		<div class="container_in">

			<!-- contents -->
			<div class="contents">
				<div class="sub_con hf_loan">

					<!-- breadcrumb -->
					<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
						<ol class="breadcrumb">
							<li class="home"><a href="#" class="txt">홈</a></li>
							<li><a href="#" class="txt">주택연금</a></li>
							<li><a href="#" class="txt">전화상담 신청</a></li>
						</ol>
					</nav>
					<!--// breadcrumb -->

					<div class="title_set">
						<div class="page-title-wrap">
							<h2 class="h-tit">상담 예약 취소</h2>
						</div>

						<div class="title_etc_menu">
							<ul>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-down"></i>
										<span class="txt">뷰어 다운로드</span>
									</a>
								</li>
								<li class="print_li">
									<a href="#">
										<i class="svg-icon ico-print"></i>
										<span class="txt">인쇄</span>
									</a>
								</li>
							</ul>
						</div>
					</div>

					<!-- 컨텐츠 -->
					<div class="debt_cont">
						<div class="debt_body hfp">

							<div class="hf_info_field_cont">
								<ul class="list">
									<li>
										<div class="main_title_cont">
											<h4 class="title">예약 취소 정보</h4>
										</div>
										<div class="fieldset">
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">예약경로</h5>
												</div>
												<div class="form-group">
													<div class="form-conts">
														<div class="krds-check-area chip_fill hfp">
															<legend class="sr-only">예약경로 선택</legend>
															<div class="krds-form-chip"><input type="radio" class="radio" name="rdo_cxl_route" id="rdo_cxl_route1"><label class="krds-form-chip-outline" for="rdo_cxl_route1">콜센터상담</label></div>
															<div class="krds-form-chip"><input type="radio" class="radio" name="rdo_cxl_route" id="rdo_cxl_route2"><label class="krds-form-chip-outline" for="rdo_cxl_route2">홈페이지</label></div>
														</div>
													</div>
												</div>
											</div>
											<div class="hf_group">
												<div class="sub_title_cont">
													<h5 class="title">상담예약번호</h5>
												</div>
												<div class="form-group">
													<div class="form-conts"><input type="text" class="krds-input" id="inp_cancel_no" title="상담예약번호" placeholder="입력해 주세요"></div>
												</div>
											</div>
										</div>
									</li>
								</ul>
							</div>

							<div class="field_btn_cont mt">
								<div class="field_btn_area right page">
									<button type="button" class="field_btn blue" data-pop-open="pop_alert_res_no">상담예약 취소하기</button>
								</div>
							</div>

						</div>
					</div>
					<!--// 컨텐츠 -->

				</div>
			</div>
			<!--// contents -->

		</div>
	</div>

	<div class="com_pop_cont active" id="pop_alert_res_no">
		<div class="pop_cont_area active pop_alert tl hfp">
			<div class="title_area">
				<h2 class="title">알림</h2>
				<button type="button" class="close"><span class="sr-only">팝업 닫기</span></button>
			</div>
			<div class="pop_info_cont">
				<div class="title_area">
					<div class="text">상담예약번호를 확인하세요.</div>
				</div>
				<div class="field_btn_cont w100">
					<div class="field_btn_area">
						<button type="button" class="field_btn blue small">확인</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="/resources/js/include.js"></script>

</html>
