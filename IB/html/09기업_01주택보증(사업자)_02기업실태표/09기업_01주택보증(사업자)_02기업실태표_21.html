<!DOCTYPE html>
<html lang="ko">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">
	<link rel="icon" href="data:;base64,iVBORw0KGgo=">
	<meta property="og:type" content="website">
	<meta property="og:locale" content="ko">
	<meta property="og:site_name" content="한국주택금융공사">
	<meta name="twitter:card" content="summary">
	<title>한국주택금융공사</title>

	<link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
	<link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/sub3.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/hf_pup_style2.css">
	<link rel="stylesheet" type="text/css" href="/resources/css/ex/hf_gieop.css">

	<script type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>
	<script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.js"></script>
	<script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
	<script type="text/javascript" src="/resources/js/krds/krds.custom.home.js"></script>
</head>
<body>
	<div data-include="../inc/header.html"></div>
	<div id="container">
		<div class="container_in">
			<div class="contents">
				<div class="sub_con">

					<nav class="krds-breadcrumb-wrap" aria-label="현재 경로" id="breadcrumb">
						<ol class="breadcrumb">
							<li class="home"><a href="#" class="txt">홈</a></li>
							<li><a href="#" class="txt">주택보증(사업자)</a></li>
							<li><a href="#" class="txt">기업실태표</a></li>
						</ol>
					</nav>

					<div class="title_set">
						<div class="page-title-wrap">
							<h2 class="h-tit">기업실태표 작성안내</h2>
						</div>
						<div class="title_etc_menu">
							<ul>
								<li class="print_li"><a href="#"><i class="svg-icon ico-down"></i><span class="txt">뷰어 다운로드</span></a></li>
								<li class="print_li"><a href="#"><i class="svg-icon ico-print"></i><span class="txt">인쇄</span></a></li>
							</ul>
						</div>
					</div>

				</div>
			</div>
		</div>
	</div>

	<!-- 팝업 -->
	<div class="com_pop_cont active" id="pop_contract_work">
		<div class="pop_cont_area pop_medium">
			<div class="title_area">
				<h2 class="title">도급공사현황 추가</h2>
				<button type="button" class="close"><span class="sr-only">팝업 닫기</span></button>
			</div>
			<div class="pop_info_cont">
				<div class="title_area">
					<strong class="sub_tit">도급공사현황 등(당해기업만)</strong>
					<div class="exclamation">
						<div class="text"><span class="point">*</span>필수 입력 항목입니다.</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_gubun">공사구분<span class="point">*</span></label></div>
					<div class="form-conts">
						<div class="krds_select_box">
							<div class="select_tit"><button type="button" id="p21_gubun">선택</button></div>
							<div class="select_list">
								<ul>
									<li><button type="button" value="1">항목1</button></li>
									<li><button type="button" value="2">항목2</button></li>
								</ul>
							</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_amt">수주금액<span class="point">*</span></label></div>
					<div class="form-conts">
						<div class="form-inp"><input type="text" id="p21_amt" class="krds-input p0" placeholder="" title="수주금액">
							<div class="txt">백만원</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_biz">사업구분<span class="point">*</span></label></div>
					<div class="form-conts">
						<div class="krds_select_box">
							<div class="select_tit"><button type="button" id="p21_biz">선택</button></div>
							<div class="select_list">
								<ul>
									<li><button type="button" value="1">항목1</button></li>
									<li><button type="button" value="2">항목2</button></li>
								</ul>
							</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_done">기성액</label></div>
					<div class="form-conts">
						<div class="form-inp"><input type="text" id="p21_done" class="krds-input p0" placeholder="" title="기성액">
							<div class="txt">백만원</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_year">사업년도<span class="point">*</span></label></div>
					<div class="form-conts">
						<input type="text" id="p21_year" class="krds-input" placeholder="" title="사업년도">
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_carry">이월공사액</label></div>
					<div class="form-conts">
						<div class="form-inp"><input type="text" id="p21_carry" class="krds-input p0" placeholder="" title="이월공사액">
							<div class="txt">백만원</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_house">세대수<span class="point">*</span></label></div>
					<div class="form-conts">
						<div class="form-inp"><input type="text" id="p21_house" class="krds-input p0" placeholder="" title="세대수">
							<div class="txt">세대</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_recv">공사미수금</label></div>
					<div class="form-conts">
						<div class="form-inp"><input type="text" id="p21_recv" class="krds-input p0" placeholder="" title="공사미수금">
							<div class="txt">백만원</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_unsale">미분양세대수<span class="point">*</span></label></div>
					<div class="form-conts">
						<div class="form-inp"><input type="text" id="p21_unsale" class="krds-input p0" placeholder="" title="미분양세대수">
							<div class="txt">세대</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_cost">총사업비<span class="point">*</span></label></div>
					<div class="form-conts">
						<div class="form-inp"><input type="text" id="p21_cost" class="krds-input p0" placeholder="" title="총사업비">
							<div class="txt">백만원</div>
						</div>
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_addr">본사주소<span class="point">*</span></label></div>
					<div class="form-conts area">
						<div class="area_box">
							<input type="text" id="p21_addr" class="krds-input" title="우측 주소검색 버튼을 통해 검색해주세요." readonly>
							<button type="button" class="field_btn black">주소검색</button>
						</div>
						<input type="text" class="krds-input" placeholder="주소 검색 버튼을 눌러주세요." title="주소" readonly>
						<input type="text" class="krds-input" placeholder="상세주소를 입력해 주세요" title="상세주소">
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_name">사업명<span class="point">*</span></label></div>
					<div class="form-conts">
						<input type="text" id="p21_name" class="krds-input" placeholder="" title="사업명">
					</div>
				</div>
				<div class="form-group">
					<div class="form-tit"><label for="p21_order">발주처필수입력<span class="point">*</span></label></div>
					<div class="form-conts">
						<input type="text" id="p21_order" class="krds-input" placeholder="" title="발주처필수입력">
					</div>
				</div>
				<div class="field_btn_cont mt">
					<div class="field_btn_area right">
						<button type="button" class="field_btn black">닫기</button>
						<button type="button" class="field_btn blue">등록</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 퍼블리싱에서만 추가되는 스크립트 -->
	<script type="text/javascript" src="/resources/js/include.js"></script>
	<!-- //퍼블리싱에서만 추가되는 스크립트 -->
</body>
</html>
