<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

                        <div class="contents">
                <div class="pro_anagement_cont">
                    <div class="step_cont">
                        <span class="blue">4단계</span> / 9단계
                    </div>
                    <div class="step_list_cont type1 step4">
                        <ol class="krds-step-wrap">
                            <li class="done">
                                <span>
                                    <span class="tit">고객정보 확인</span>
                                </span>
                            </li>
                            <li class="done">
                                <span>
                                    <span class="tit">정보제공동의</span>
                                </span>
                            </li>
                            <li class="done">
                                <span>
                                    <span class="tit">우선순위선택</span>
                                </span>
                            </li>
                            <li class="active">
                                <span>
                                <em class="sr-only">현재단계</em>
                                    <span class="tit">해당요건 선택</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">적용요건 선택</span>
                                </span>
                            </li>
                        </ol>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont gap down">
                    <div class="main_tit_area type2 type1 between m0">
                        <div class="title">우선순위 선택</div>
                        <button type="button" class="reset_btn"><i class="svg-icon ico-reset"></i>선택 초기화</button>
                    </div>
                    <div class="sub_tit_area m0">
                        <div class="tit">해당되는 항목을 선택해 주세요.</div>
                    </div>
                    <div class="check_order_list type_check">
                        <div class="krds-form-check check_order_chip">
                            <input type="checkbox" id="chkCond1" name="checkCond">
                            <label for="chkCond1">
                                <span class="chip_num" aria-hidden="true"></span>
                                <span class="chip_txt">생애최초 주택구입</span>
                            </label>
                        </div>
                        <div class="krds-form-check check_order_chip">
                            <input type="checkbox" id="chkCond2" checked name="checkCond">
                            <label for="chkCond2">
                                <span class="chip_num" aria-hidden="true"></span>
                                <span class="chip_txt">현재 무주택</span>
                            </label>
                        </div>
                        <div class="krds-form-check check_order_chip">
                            <input type="checkbox" id="chkCond3" checked name="checkCond">
                            <label for="chkCond3">
                                <span class="chip_num" aria-hidden="true"></span>
                                <span class="chip_txt">전세사기 피해자</span>
                            </label>
                        </div>
                        <div class="krds-form-check check_order_chip">
                            <input type="checkbox" id="chkCond4" name="checkCond">
                            <label for="chkCond4">
                                <span class="chip_num" aria-hidden="true"></span>
                                <span class="chip_txt">해당없음</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page fixed">
                <button type="button" class="com_btn blue2">다음</button>
            </div>

        </div>
    </div>

    <div data-include="../inc/footer.html"></div>

</div>
