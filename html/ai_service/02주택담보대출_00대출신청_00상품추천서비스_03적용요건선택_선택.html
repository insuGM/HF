<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

                        <div class="contents">
                <div class="pro_anagement_cont">
                    <div class="step_cont">
                        <span class="blue">5단계</span> / 9단계
                    </div>
                    <div class="step_list_cont type1 step4">
                        <ol class="krds-step-wrap">
                            <li class="done">
                                <span>
                                    <span class="tit">고객정보 확인</span>
                                </span>
                            </li>
                            <li class="done">
                                <span>
                                    <span class="tit">정보제공동의</span>
                                </span>
                            </li>
                            <li class="done">
                                <span>
                                    <span class="tit">해당요건 선택</span>
                                </span>
                            </li>
                            <li class="active">
                                <span>
                                <em class="sr-only">현재단계</em>
                                    <span class="tit">적용요건 선택</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">필요정보입력</span>
                                </span>
                            </li>
                        </ol>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont gap down">
                    <div class="main_tit_area type2 type1 between m0">
                        <div class="title">적용요건 선택</div>
                        <button type="button" data-pop="com_pop11" class="reset_btn">우대 금리 정보</button>
                    </div>
                    <div class="sub_tit_area m0">
                        <div class="tit">해당되는 항목을 선택해 주세요.</div>
                    </div>
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>요건 선택<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="check_order_list type_check col2">
                            <div class="krds-form-check check_order_chip">
                                <input type="checkbox" id="chkApply1" name="checkApply">
                                <label for="chkApply1">
                                    <span class="chip_num" aria-hidden="true"></span>
                                    <span class="chip_txt">1자녀</span>
                                </label>
                            </div>
                            <div class="krds-form-check check_order_chip">
                                <input type="checkbox" id="chkApply2" name="checkApply" checked checked>
                                <label for="chkApply2">
                                    <span class="chip_num" aria-hidden="true"></span>
                                    <span class="chip_txt">2자녀</span>
                                </label>
                            </div>
                            <div class="krds-form-check check_order_chip">
                                <input type="checkbox" id="chkApply3" name="checkApply">
                                <label for="chkApply3">
                                    <span class="chip_num" aria-hidden="true"></span>
                                    <span class="chip_txt">3자녀 이상</span>
                                </label>
                            </div>
                            <div class="krds-form-check check_order_chip">
                                <input type="checkbox" id="chkApply4" name="checkApply">
                                <label for="chkApply4">
                                    <span class="chip_num" aria-hidden="true"></span>
                                    <span class="chip_txt">신생아 가구</span>
                                </label>
                            </div>
                            <div class="krds-form-check check_order_chip">
                                <input type="checkbox" id="chkApply5" name="checkApply">
                                <label for="chkApply5">
                                    <span class="chip_num" aria-hidden="true"></span>
                                    <span class="chip_txt">신혼부부</span>
                                </label>
                            </div>
                            <div class="krds-form-check check_order_chip">
                                <input type="checkbox" id="chkApply6" name="checkApply">
                                <label for="chkApply6">
                                    <span class="chip_num" aria-hidden="true"></span>
                                    <span class="chip_txt">장애인 가구</span>
                                </label>
                            </div>
                            <div class="krds-form-check check_order_chip">
                                <input type="checkbox" id="chkApply7" name="checkApply">
                                <label for="chkApply7">
                                    <span class="chip_num" aria-hidden="true"></span>
                                    <span class="chip_txt">한부모 가구</span>
                                </label>
                            </div>
                            <div class="krds-form-check check_order_chip">
                                <input type="checkbox" id="chkApply8" name="checkApply">
                                <label for="chkApply8">
                                    <span class="chip_num" aria-hidden="true"></span>
                                    <span class="chip_txt">다문화 가구</span>
                                </label>
                            </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <ul class="krds-info-list decimal">
                        <li>체크되어 있는 항목들은 공사가 공공 마이데이터 및 스크래핑을 통해 분석한 내용입니다.</li>
                        <li>최종 결과 화면에서 변경 후 재조회 할 수 있어요.</li>

    <!-- TYPE1 -->
    <div class="com_pop_wrap full type11"> 
        <div class="com_pop_cont"> 
            <div class="title_area">

            </div>
            <div class="com_pop_content">
                <div class="pro_anagement_cont gap down">
                    <ul class="disclosure_list">
                        <li>
                            <div class="krds-disclosure">
                                <button type="button" class="btn-conts-expand">주택보유지 인정기준</button>
                                <div class="expand-wrap">
                                    <div class="disclosure_cont">
                                        내용을 입력해 주세요.
                                    </div>
                                </div>
                            </div>
                        </li>
                        <li>

                                <div class="expand-wrap">
                                    <div class="disclosure_cont">

                                    </div>
                                </div>
                            </div>
                        </li>
                        <li>
                            <div class="krds-disclosure">
                                <button type="button" class="btn-conts-expand">담보한정(유한책임) 보금자리론</button>
                                <div class="expand-wrap">
                                    <div class="disclosure_cont">
                                        내용을 입력해 주세요.
                                    </div>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div> 
            </div>
        </div>
