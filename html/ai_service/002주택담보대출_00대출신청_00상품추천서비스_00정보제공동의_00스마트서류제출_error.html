    <link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">

<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

                        <div class="contents">
                <div class="pro_anagement_cont">
                    <div class="step_cont">
                        <span class="blue">2단계</span> / 9단계
                    </div>
                    <div class="step_list_cont type1 step2">
                        <ol class="krds-step-wrap">
                            <li class="done">
                                <span>
                                    <span class="tit">정보제공동의</span>
                                </span>
                            </li>
                            <li class="active">
                                <span>
                                <em class="sr-only">현재단계</em>
                                    <span class="tit">스마트 서류제출</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">우선순위선택</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">스마트서류 제출</span>
                                </span>
                            </li>
                        </ol>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont">
                    <div class="main_tit_area">
                        <div class="title">스마트 서류제출</div>
                        <button type="button" data-pop="com_pop" class="link_btn">스마트 서류제출 안내</button>
                    </div>
                    <div class="fieldset">
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>성명<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts is-error">
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0" placeholder="성명을 입력해 주세요." title="성명">
                                </div>
                                <p class="form-hint-invalid">성명을 입력해 주세요</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>주민등록번호<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts is-error">
                                <ul class="input-group range set">
                                    <li>
                                        <input type="text" class="krds-input p0" placeholder="입력해 주세요." title="주민등록번호 앞자리">
                                    </li>
                                    <li class="mark">-</li>
                                    <li>
                                        <input type="text" class="krds-input p0 disabled" value="●●●●●●●" title="주민등록번호 뒷자리">
                                    </li>
                                </ul>
                                <p class="form-hint-invalid">주민등록번호를 입력해 주세요</p>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>가족(혼인)관계증명원<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="famRel01" name="famRel" class="radio" checked>
                                        <label for="famRel01">부</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="famRel02" name="famRel" class="radio">
                                        <label for="famRel02">모</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="famRel03" name="famRel" class="radio">
                                        <label for="famRel03">배우자</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="famRel04" name="famRel" class="radio">
                                        <label for="famRel04">자녀</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0" placeholder="성명을 입력해 주세요." title="가족(혼인)관계증명원 성명">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>제출대상 서류</label></div>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list decimal">
                                    <li>소득금액증명원, 건강보험자격득실확인서, 건강장기요양보험료 납부확인서</li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>인증수단<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="authType01" name="authType" class="radio">
                                        <label for="authType01">공동인증</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="authType02" name="authType" class="radio">
                                        <label for="authType02">금융인증</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="authType03" name="authType" class="radio">
                                        <label for="authType03">간편인증</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>서비스 가능 시간</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="occupation_list_area type1">
                                    <ul class="list">
                                        <li>
                                            <div class="text_area">
                                                <div class="text bold">서류별 소득금액증명원</div>
                                                <div class="text">연중무휴 08:00 ~ 22:00</div>
                                            </div>
                                        </li>
                                        <li>
                                            <div class="text_area">
                                                <div class="text bold">그 외 서류</div>
                                                <div class="text">24시간</div>
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn" disabled>다음</button>
            </div>

        </div>
    </div>

    <div data-include="../inc/footer.html"></div>

</div>

<script type="text/javascript" src="/resources/js/include.js"></script>

</html>
