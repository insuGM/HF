                                    </label>
                                </div>

                                        <span class="note">* 상환용도의 경우 전세사기피해자 등으로 결정되기 전에 전세사기피해주택 낙찰 시 이용한 주택담보대출을 상환하기 위하여 기존 대출의 잔액 범위 내 신청한 경우 해당(배우자 이용건도 포함)</span>
                                        <span class="mark" aria-hidden="true"></span>
                                    </label>
