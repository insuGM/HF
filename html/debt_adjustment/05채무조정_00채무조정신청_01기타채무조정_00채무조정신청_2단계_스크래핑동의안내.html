<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="pro_anagement_cont gap">
                    <div class="step_cont">
                        <span class="blue">2단계</span> / 4단계
                    </div>
                    <div class="step_list_cont type1">
                        <ol class="krds-step-wrap">
                            <li class="done">
                                <span>
                                    <span class="tit">채무내역 및 상환계획</span>
                                </span>
                            </li>
                            <li class="active">
                                <span>
                                    <em class="sr-only">현재단계</em>
                                    <span class="tit">신청동의</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">신청서 작성</span>
                                </span>
                            </li>
                        </ol>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont gap down">
                    <div class="pro_anagement_chk_list_area">
                        <div class="fieldset">
                            <div class="form-group none_bg">
                                <div class="form-conts">
                                    <div class="krds-check-area chk-column">
                                        <div class="krds-form-check all">
                                            <input type="checkbox" id="chk_all">
                                            <label for="chk_all">
                                                전체 동의
                                                <button type="button" data-pop="com_pop" class="btn">전체보기</button>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group none_bg">
                                <div class="form-conts">
                                    <div class="krds-check-area chk-column">
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="chk_1">
                                            <label for="chk_1">[필수] 채무조정 요청서</label>
                                        </div>
                                    </div>
                                    <div class="krds-check-area chk-column">
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="chk_2">
                                            <label for="chk_2">[필수] 신용도판단정보등록 해제 요청서</label>
                                        </div>
                                    </div>
                                    <div class="krds-check-area chk-column">
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="chk_3">
                                            <label for="chk_3">[선택] 서류제출자동화(스크래핑) 서비스이용동의서</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="btn_cont page fixed">
                    <button type="button" class="com_btn" disabled>다음</button>
                </div>
            </div>

        </div>
    </div>

    <div data-include="../inc/footer.html"></div>
            <!-- 서류제출자동화(스크래핑) 서비스 이용안내 -->
            <div class="com_pop_wrap type11 active">
                <div class="com_pop_cont type_bottom_sheet active">
                    <div class="title_area">
                        <div class="title">서류제출자동화(스크래핑)<br>서비스 이용안내</div>
                        <button type="button" class="close" title="팝업 닫기"></button>
                    </div>
                    <div class="com_pop_content">
                        <div class="pro_anagement_cont gap down p0">
                            <ul class="krds-info-list decimal">
                                <li>신청인(또는 배우자)의 서류 제출 자동화(스크래핑) 서비스가 미동의되어 있습니다.</li>
                                <li>스크래핑 서비스를 동의하시면, 각종 서류제출이 자동으로 제출되어 보다 편리하게 대출 신청을 진행하실 수 있습니다.</li>
                            </ul>
                        </div>
                    </div>
                    <div class="btn_cont page direction">
                        <button type="button" class="com_btn blue2">스크래핑 동의 후 신청</button>
                        <button type="button" class="com_btn text" data-close-pop>다음에 진행</button>
                    </div>
                </div>
            </div>
            <!-- //서류제출자동화(스크래핑) 서비스 이용안내 -->


</div>
