<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="pro_anagement_cont gap">
                    <div class="step_cont">
                        <span class="blue">3단계</span> / 4단계
                    </div>
                    <div class="step_list_cont type1">
                        <ol class="krds-step-wrap">
                            <li class="done">
                                <span>
                                    <span class="tit">신청동의</span>
                                </span>
                            </li>
                            <li class="active">
                                <span>
                                    <em class="sr-only">현재단계</em>
                                    <span class="tit">신청서 작성</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">신청확인</span>
                                </span>
                            </li>
                        </ol>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont gap down">
                    <div class="main_tit_area m0">
                        <div class="title">개인정보 입력</div>
                    </div>
                    <div class="com_info_inp_list_cont">
                        <ul class="list">
                            <li>
                                <div class="cont">
                                    <div class="fieldset">
                                        <div class="form-group">
                                            <div class="form-tit-cont">
                                                <div class="form-tit"><label>주민등록 번호<span class="point">*</span></label></div>
                                            </div>
                                            <div class="form-conts">
                                                <div class="number_area">
                                                    <div class="cut_inp_cont">
                                                        <div class="inp_area">
                                                            <input type="text" class="krds-input" value="790301" title="주민등록번호 앞자리">
                                                        </div>
                                                        <span class="txt">-</span>
                                                        <div class="inp_area sty2">
                                                            <input type="text" class="krds-input" value="1••••••" title="주민등록번호 뒷자리" disabled>
                                                            <button type="button" class="krds-btn medium icon">
                                                                <span class="sr-only">키패드 열기</span>
                                                                <i class="svg-icon ico-keypad"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                            <li>
                                <div class="cont">
                                    <div class="fieldset">
                                        <div class="form-group">
                                            <div class="form-tit-cont">
                                                <div class="form-tit"><label>주소<span class="point">*</span></label></div>
                                                <button type="button" class="btn">주소검색</button>
                                            </div>
                                            <div class="form-conts">
                                                <div class="form-inp">
                                                    <input type="text" class="krds-input p0 disabled" placeholder="주소를 검색해주세요" title="주소" disabled>
                                                </div>
                                                <div class="form-inp">
                                                    <input type="text" class="krds-input p0" placeholder="상세주소를 입력해주세요" title="상세주소">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                            <li>
                                <div class="cont">
                                    <div class="fieldset">
                                        <div class="form-group">
                                            <div class="form-tit-cont">
                                                <div class="form-tit"><label>휴대전화<span class="point">*</span></label></div>
                                            </div>
                                            <div class="form-conts">
                                                <div class="form-inp">
                                                    <input type="text" class="krds-input p0" placeholder="입력해 주세요" title="휴대전화">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                            <li>
                                <div class="cont">
                                    <div class="fieldset">
                                        <div class="form-group">
                                            <div class="form-tit-cont">
                                                <div class="form-tit"><label>전화번호<span class="point">*</span></label></div>
                                            </div>
                                            <div class="form-conts">
                                                <div class="form-inp">
                                                    <input type="text" class="krds-input p0" placeholder="입력해 주세요" title="전화번호">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                            <li>
                                <div class="cont">
                                    <div class="fieldset">
                                        <div class="form-group">
                                            <div class="form-tit-cont">
                                                <div class="form-tit"><label>이메일<span class="point">*</span></label></div>
                                            </div>
                                            <div class="form-conts">
                                                <div class="form-inp">
                                                    <input type="text" class="krds-input p0" placeholder="입력해 주세요" title="이메일">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                    <div class="pro_anagement_chk_list_area">
                        <div class="fieldset">
                            <div class="form-group">
                                <div class="form-conts">
                                    <div class="krds-check-area chk-column">
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agreeApply">
                                            <label for="agreeApply" class="bold">본인은 위의 내용을 모두 이해하였으며, 위와 같이 채무의 조정을 신청합니다</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="btn_cont page">
                    <button type="button" class="com_btn" disabled>간편서류제출</button>
                </div>
            </div>

        </div>
