<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">
        <link rel="icon" href="data:;base64,iVBORw0KGgo=">
        <meta property="og:type" content="website">
        <meta property="og:locale" content="ko">
        <meta property="og:site_name" content="한국주택금융공사">
        <meta name="twitter:card" content="summary">
        <title>한국주택금융공사</title>
        <link rel="stylesheet" type="text/css" href="/resources/css/ex/layout.css">
        <link rel="stylesheet" type="text/css" href="/resources/css/ex/font.css">
        <link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
        <link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
        <link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
        <link rel="stylesheet" type="text/css" href="/resources/css/ex/content.css">
        <link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
        <link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
        <script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
        <script defer type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>

        <link rel="stylesheet" type="text/css" href="/resources/js/swiper/swiper-bundle.min.css">
        <link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
        <link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
        <link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">

        <script type="text/javascript" src="/resources/js/swiper/swiper-bundle.min.js"></script>
        <script type="text/javascript" src="/resources/js/krds/krds.js"></script>
        <script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
        <script type="text/javascript" src="/resources/js/krds/krds.custom.home.js"></script>
    </head>
    <body>
        <div class="wrapper main app-main" id="app">
            <div id="container">
                <div class="container_in">
                    <header class="nmain_header sub">
                        <button type="button" class="back" title="이전"><i class="svg-icon ico-angle left"></i></button>
                        <h1 class="tit">증명서 발급</h1>
                    </header>
                    <div class="nmain nmain_form">
                        <section class="nmain_sec">
                            <div class="nmain_form_tit">발급목록<span class="point">*</span></div>
                            <div class="nmain_field">
                                <label for="certJob">업무 구분</label>
                                <button type="button" class="nmain_select" id="certJob">증명서 선택<i class="svg-icon ico-angle"></i></button>
                            </div>
                            <div class="nmain_field">
                                <label for="certType">증명서 유형</label>
                                <button type="button" class="nmain_select" id="certType">증명서 선택<i class="svg-icon ico-angle"></i></button>
                            </div>
                        </section>
                        <section class="nmain_sec">
                            <div class="nmain_form_tit">추가정보<span class="point">*</span></div>
                            <div class="nmain_field">
                                <label for="certAcct">완납 계좌번호</label>
                                <input type="text" id="certAcct" class="nmain_input" placeholder="입력해 주세요">
                            </div>
                            <div class="nmain_field">
                                <label for="certRsn">발급사유</label>
                                <button type="button" class="nmain_select on" id="certRsn">기타<i class="svg-icon ico-angle"></i></button>
                                <input type="text" class="nmain_input" placeholder="입력해 주세요">
                            </div>
                        </section>
                        <section class="nmain_sec">
                            <button type="button" class="nmain_submit" disabled>발급</button>
                        </section>
                    </div>

                </div>
            </div>

        </div>
        <script type="text/javascript" src="/resources/js/include.js"></script>
    </body>
</html>
