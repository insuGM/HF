<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="com_ok_cont">
                    <div class="icon">
                        <img src="/resources/images/common/icon/ico_com_ok.svg" alt="">
                    </div>
                    <div class="title_area">
                        <div class="title">대출 신청이<br><span class="blue">완료</span>되었습니다.</div>
                    </div>
                </div>
                <div class="pro_anagement_cont">
                    <div class="krds_accordion_area com_ok_accordion">
                        <div class="krds-accordion blue">
                            <div class="accordion-item active">
                                <h2 class="accordion-header">
                                    <button type="button" class="btn-accordion active">요청사항</button>
                                </h2>
                                    <div class="accordion-collapse collapse">
                                        <div class="accordion-body gap">
                                            <div class="chip-wrap wrap">
                                                <div class="krds-form-chip type1">
                                                    <input type="radio" id="req00" name="req" class="radio">
                                                    <label for="req00">대한한도최대증액</label>
                                                </div>
                                                <div class="krds-form-chip type1">
                                                    <input type="radio" id="req01" name="req" class="radio">
                                                    <label for="req01">빠른심사요청</label>
                                                </div>
                                                <div class="krds-form-chip type1">
                                                    <input type="radio" id="req02" name="req" class="radio" checked>
                                                    <label for="req02">직접입력</label>
                                                </div>
                                            </div>
                                            <div class="textarea-wrap">
                                                <textarea id="reqText" class="krds-input" placeholder="내용을 입력하세요" title="요청사항 입력"></textarea>
                                                <p class="textarea-count">
                                                    <span class="text-point-primary">1</span><span class="text-num">/100</span>
                                                </p>
                                            </div>
                                        </div>
                                    </div>
                            </div>
                            <div class="accordion-item active">
                                <h2 class="accordion-header">
                                    <button type="button" class="btn-accordion active">대출조건 유의사항 확인</button>
                                </h2>
                                    <div class="accordion-collapse collapse">
                                        <div class="accordion-body">
                                            <ul class="krds-info-list decimal">
                                                <li>선택하신 금융기관의 콜센터 또는 한국주택금융공사의 콜센터에서 2주 이내에 고객님께 안내전화를 드릴 예정입니다.</li>
                                                <li>대출예정일 순으로 콜센터에서 전화를 드리므로 대출예정일이 여유가 있으신 고객님은 여유를 가지고 기다리시기 바랍니다.</li>
                                                <li>대출진행상황은 MY HF &gt; 이용상품 조회 &gt; 주택담보대출 조회 &gt; 대출신청조회 메뉴에서 확인하실 수 있습니다.</li>
                                                <li>대출에 필요한 서류를 제출하셔야 대출심사가 진행됩니다. 서류는 '간편 서류제출'에서 간편하게 제출하실 수 있습니다.</li>
                                            </ul>
                                        </div>
                                    </div>
                            </div>
                        </div>
                    </div>
                    <div class="btn_cont mt">
                        <button type="button" class="com_btn">신청내역 조회</button>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn blue2">간편 서류제출</button>
            </div>

        </div>
    </div>

    <div data-include="../inc/footer.html"></div>
