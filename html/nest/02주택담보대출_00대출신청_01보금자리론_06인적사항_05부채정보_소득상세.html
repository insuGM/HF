    <link rel="stylesheet" type="text/css" href="/resources/css/ex/slick.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/board.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">

</head>
<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents none_bg">
                
            </div>


        </div>
    </div>

    <div data-include="../inc/footer.html"></div>

    <div class="com_pop_wrap full active type11">
        <div class="com_pop_cont active">
            <div class="title_area">
                <div class="title">소득 상세</div>
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content">
                <div class="pro_anagement_cont gap">
                    <div class="sub_main_tit_area gap">
                        <div class="title">현재 재직(사업영위) 중인 직장(사업장)만 등록해 주세요.</div>
                        <div class="txt">소득발생시작일을 입력하고 내용을 확인 하신 후 저장해주시기 바랍니다.</div>
                    </div>
                    <div class="fieldset">
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>소득종류<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap wrap">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incType00" name="incType" class="radio" checked>
                                        <label for="incType00">근로소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incType01" name="incType" class="radio">
                                        <label for="incType01">사업소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incType02" name="incType" class="radio">
                                        <label for="incType02">연금소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incType03" name="incType" class="radio">
                                        <label for="incType03">기타소득</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list importance">
                                    <li>소득금액증명원, 연말정산용 원천징수영수증, 급여명세표 상의 금액입력</li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>직장명(사업장 명)<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0" placeholder="입력해 주세요." title="직장명(사업장 명)">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>재직(사업영위)기간<span class="point">*</span></label></div>
                                <a href="#" class="link_btn">인정소득 산정 안내</a>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap wrap">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="workPeriod00" name="workPeriod" class="radio" checked>
                                        <label for="workPeriod00">1년 1개월이상<br> (2개년 증빙)</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="workPeriod01" name="workPeriod" class="radio">
                                        <label for="workPeriod01">1년 미만<br> (1개년 증빙)</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>최근년도<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="number_area gap cont_line type2">
                                    <div class="inp_area">
                                        <div class="calendar-input">
                                            <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="최근년도 시작일">
                                        </div>
                                    </div>
                                    <div class="txt">-</div>
                                    <div class="inp_area">
                                        <div class="calendar-input">
                                            <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="최근년도 종료일">
                                            <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                                <span class="sr-only">달력 열기</span>
                                                <i class="svg-icon ico-calendar"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-text">
                                    <div class="text">
                                        <div class="num">영</div>
                                        <div class="txt">원</div>
                                    </div>
                                </div>
                                <div class="form-inp">
                                    <input type="text" class="krds-input" placeholder="0" title="최근년도 소득">
                                    <div class="txt">원</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>최근년도 전년도<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="number_area gap cont_line type2">
                                    <div class="inp_area">
                                        <div class="calendar-input">
                                            <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="최근년도 시작일">
                                        </div>
                                    </div>
                                    <div class="txt">-</div>
                                    <div class="inp_area">
                                        <div class="calendar-input">
                                            <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="최근년도 종료일">
                                            <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                                <span class="sr-only">달력 열기</span>
                                                <i class="svg-icon ico-calendar"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-text">
                                    <div class="text">
                                        <div class="num">영</div>
                                        <div class="txt">원</div>
                                    </div>
                                </div>
                                <div class="form-inp">
                                    <input type="text" class="krds-input" placeholder="0" title="최근년도 전년도 소득">
                                    <div class="txt">원</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>최종소득(예상)<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-text">
                                    <div class="text">
                                        <div class="num">영</div>
                                        <div class="txt">원</div>
                                    </div>
                                </div>
                                <div class="cont_line type2">
                                    <div class="form-inp ">
                                        <input type="text" class="krds-input" placeholder="0" title="최종소득(예상)" readonly>
                                        <div class="txt">원</div>
                                    </div>
                                </div>
                                <div class="krds-check-area">
                                    <div class="krds-form-check">
                                        <input type="checkbox" id="alwaysIncome">
                                        <label for="alwaysIncome">상시소득</label>
                                    </div>
                                </div>
                                <a href="#" class="link_btn">상시소득 인정기준</a>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list importance">
                                    <li>2개년 소득의 차이가 20% 이하로 최근년도 소득이 적용됩니다.</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="btn_cont page m0">
                    <button type="button" class="com_btn blue2">확인</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript" src="/resources/js/include.js"></script>
</body>
</html>
