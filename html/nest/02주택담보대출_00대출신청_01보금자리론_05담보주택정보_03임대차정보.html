    <title>한국주택금융공사</title>

    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_common/cms.css">

    <link rel="stylesheet" type="text/css" href="/resources/css/ex/font.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/slick.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/board.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">

    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/common01.css">

    <!-- JavaScript 파일들 -->
    <script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
    <script defer type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>
    
    <!-- !추가부분 -->
    <link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
    <link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">

    <script type="text/javascript" src="/resources/js/krds/krds.js"></script>
    <script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>

    <!--// !추가부분 -->
</head>
<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents none_bg">
                <div class="pro_anagement_cont gap">
                    <div class="main_tit_area m0">
                        <div class="title">임대차 정보</div>
                    </div>
                    <div class="com_list_bg_cont p0">
                        <div class="com_list_bg_area">
                            <ul class="krds-info-list decimal">
                                <li>임차인(세입자)이 보금자리론 실행일 당일까지 전출하는 임대차계약은 제외합니다.</li>
                                <li>임대차가 있는 경우 생애최초 및 유한책임 보금자리론 선택 불가합니다.</li>
                            </ul>
                        </div>
                    </div>
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>임대차 유무<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                <div class="krds-form-chip type1">
                                    <input type="radio" id="leaseYn00" name="leaseYn" class="radio">
                                    <label for="leaseYn00">없음</label>
                                </div>
                                <div class="krds-form-chip type1">
                                    <input type="radio" id="leaseYn01" name="leaseYn" class="radio" checked>
                                    <label for="leaseYn01">있음</label>
                                </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>총 방수<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input disabled" title="총 방수" disabled>
                                    <span class="txt">개</span>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>반환예정 임대방수<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input" title="반환예정 임대방수">
                                    <span class="txt">개</span>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>임대 반환건수<span class="point">*</span></label></div>
                                <button type="button" class="btn gray2">등록</button>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input" title="임대 반환건수">
                                    <span class="txt">건</span>
                                </div>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list decimal">
                                    <li>입력 사항과 상이할 경우 실행이 되지 못할 수 있습니다.</li>
                                </ul>
                                <ul class="krds-info-list importance">
                                    <li>신청인과 임차인의 관계가 부부인 경우 대출 불가</li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group non      e_bg">
                            <div class="form-tit-cont type1">
                                <div class="form-tit">
                                    <label>임대 반환내용<span class="point">*</span></label>
                                <button type="button" class="btn gray2">초기화</button>
                                </div>
                                <a href="#" class="link_btn">임대차만료일·반환보증금</a>
                            </div>
                            <div class="form-conts">
                                <div class="com_list_bg_cont gap">
                                    <div class="com_list_bg_area">
                                        <div class="fieldset">
                                            <div class="form-tit-cont type1">
                                                <div class="form-tit"><label>임대차만료일<span class="point">*</span></label></div>
                                            </div>
                                            <div class="calendar-input">
                                                <input type="text" class="krds-input datepicker cal" placeholder="YYYY.MM.DD" title="임대차만료일">
                                                <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                                    <span class="sr-only">달력 열기</span>
                                                    <i class="svg-icon ico-calendar"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="com_list_bg_area">
                                        <div class="fieldset">
                                            <div class="form-tit-cont type1">
                                                <div class="form-tit"><label>반환예정보증금<span class="point">*</span></label></div>
                                            </div>
                                            <div class="form-conts">
                                                <div class="form-text">
                                                    <div class="text">
                                                        <div class="num">영</div>
                                                        <div class="txt">원</div>
                                                    </div>
                                                </div>
                                                <div class="form-inp">
                                                    <input type="text" class="krds-input" placeholder="0" title="보금자리론 금액">
                                                    <div class="txt">원</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>임대보증금 합계액<span class="point">*</span></label></div>
                                <a href="#" class="link_btn">임대보증금 합계 입력</a>
                            </div>
                            <div class="fieldset">
                                <div class="form-conts">
                                    <div class="form-text">
                                        <div class="text">
                                            <div class="num">영</div>
                                            <div class="txt">원</div>
                                        </div>
                                    </div>
                                    <div class="form-inp">
                                        <input type="text" class="krds-input" placeholder="0" title="보금자리론 금액">
                                        <div class="txt">원</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn" disabled>저장</button>
            </div>

        </div>
    </div>

    <div data-include="../inc/footer.html"></div>

</div>

<script type="text/javascript" src="/resources/js/include.js"></script>
</body>
</html>
