<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents none_bg">
                <div class="pro_anagement_cont gap">
                    <div class="main_tit_area m0">
                        <div class="title">소득정보</div>
                    </div>
                    <div class="fieldset">
                        <div class="form-group">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>소득정보 안내</label></div>
                                <a href="#" class="link_btn">소득정보 입력 안내</a>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>소득증빙 방법 여부<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeProof00" name="incomeProof" class="radio" checked>
                                        <label for="incomeProof00">본인</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeProof01" name="incomeProof" class="radio">
                                        <label for="incomeProof01">부부공동</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>소득 종류<span class="point">*</span></label></div>
                                <a href="#" class="link_btn">증빙·인정소득 정의</a>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeType00" name="incomeType" class="radio" checked>
                                        <label for="incomeType00">증빙소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeType01" name="incomeType" class="radio">
                                        <label for="incomeType01">인정소득</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>소득 입력 방법<span class="point">*</span></label></div>
                                <a href="#" class="link_btn">마이데이터 소득 확인</a>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt type2">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeInput00" name="incomeInput" class="radio" checked>
                                        <label for="incomeInput00">공공마이데이터로 산출 된 소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeInput01" name="incomeInput" class="radio">
                                        <label for="incomeInput01">직접 입력</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>소득정보안내</label></div>
                            </div>
                            <div class="form-conts">
                                <ul class="income_list">
                                    <li>
                                        <div class="income_hd">
                                            <div class="tit">본인 소득<span class="point">*</span></div>
                                            <div class="rrn_btn_area">
                                                <button type="button" class="area_btn small">소득없음</button>
                                                <button type="button" class="area_btn small">소득추가</button>
                                            </div>
                                        </div>
                                        <div class="krds-table-wrap income_tbl">
                                            <table class="tbl data head_bg_none">
                                                <caption>본인 소득 목록</caption>
                                                <colgroup>
                                                    <col style="width: 20%;">
                                                    <col style="width: 40%;">
                                                    <col style="width: 40%;">
                                                </colgroup>
                                                <thead>
                                                    <tr>
                                                        <th scope="col">
                                                            <div class="krds-form-check">
                                                                <input type="checkbox" id="incomeAll">
                                                                <label for="incomeAll"><span class="sr-only">전체 선택</span></label>
                                                            </div>
                                                        </th>
                                                        <th scope="col" class="txt_c">직장(사업자)명</th>
                                                        <th scope="col" class="txt_r">(예상)최종소득</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <td>
                                                            <div class="krds-form-check">
                                                                <input type="checkbox" id="income00">
                                                                <label for="income00"><span class="sr-only">사업자명1 선택</span></label>
                                                            </div>
                                                        </td>
                                                        <td class="txt_c">사업자명1</td>
                                                        <td class="txt_r">20,000,000</td>
                                                    </tr>
                                                    <tr>
                                                        <td>
                                                            <div class="krds-form-check">
                                                                <input type="checkbox" id="income01">
                                                                <label for="income01"><span class="sr-only">사업자명2 선택</span></label>
                                                            </div>
                                                        </td>
                                                        <td class="txt_c">사업자명2</td>
                                                        <td class="txt_r">20,000,000</td>
                                                    </tr>
                                                    <tr class="sum">
                                                        <td></td>
                                                        <td class="txt_c">합계</td>
                                                        <td class="txt_r">40,000,000</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div class="btn_right_area">
                                            <button type="button" class="btn gray">수정</button>
                                            <button type="button" class="btn gray">삭제</button>
                                        </div>
                                    <li>
                                        <div class="income_hd">
                                            <div class="tit">배우자 소득<span class="point">*</span></div>
                                            <div class="rrn_btn_area">
                                                <button type="button" class="area_btn small">소득없음</button>
                                                <button type="button" class="area_btn small">소득추가</button>
                                            </div>
                                        </div>
                                        <div class="krds-table-wrap income_tbl">
                                            <table class="tbl data head_bg_none">
                                                <caption>배우자 소득 목록</caption>
                                                <colgroup>
                                                    <col style="width: 20%;">
                                                    <col style="width: 40%;">
                                                    <col style="width: 40%;">
                                                </colgroup>
                                                <thead>
                                                    <tr>
                                                        <th scope="col">
                                                            <div class="krds-form-check">
                                                                <input type="checkbox" id="spouseAll">
                                                                <label for="spouseAll"><span class="sr-only">전체 선택</span></label>
                                                            </div>
                                                        </th>
                                                        <th scope="col" class="txt_c">직장(사업자)명</th>
                                                        <th scope="col" class="txt_r">(예상)최종소득</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <td>
                                                            <div class="krds-form-check">
                                                                <input type="checkbox" id="spouse00">
                                                                <label for="spouse00"><span class="sr-only">선택</span></label>
                                                            </div>
                                                        </td>
                                                        <td class="txt_c">-</td>
                                                        <td class="txt_r">0</td>
                                                    </tr>
                                                    <tr class="sum">
                                                        <td></td>
                                                        <td class="txt_c">합계</td>
                                                        <td class="txt_r">0</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div class="btn_right_area">
                                            <button type="button" class="btn gray">수정</button>
                                            <button type="button" class="btn gray">삭제</button>
                                        </div>
                                    </li>
                                    </li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>소득합계</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="income_sum_cont">
                                    <div class="income_area">
                                        <div class="sum_top">
                                            <div class="sum_tit">
                                                <span class="tit">소득 제한</span>
                                                <span class="num">7,000</span>
                                            </div>
                                            <span class="unit">(단위: 만원)</span>
                                        </div>
                                        <div class="bar_line_cont">
                                            <div class="bar blue3" style="width: 53%;"></div>
                                            <div class="bar blue" style="width: 27%;"></div>
                                            <div class="bar blue2" style="width: 20%;"></div>
                                        </div>
                                    </div>
                                    <ul class="sum_legend">
                                        <li>
                                            <div class="legend"><span class="dot blue3"></span>본인</div>
                                            <div class="val">4,000</div>
                                        </li>
                                        <li>
                                            <div class="legend"><span class="dot blue"></span>배우자</div>
                                            <div class="val">1,600</div>
                                        </li>
                                        <li>
                                            <div class="legend"><span class="dot blue2"></span>여유 소득한도</div>
                                            <div class="val">1,000</div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn" disabled>저장</button>
            </div>

        </div>
    </div>

    <div data-include="../inc/footer.html"></div>

</div>
