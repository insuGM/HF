<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents none_bg">
                <div class="pro_anagement_cont gap">
                    <div class="main_tit_area m0">
                        <div class="title">주택보유정보</div>
                    </div>
                    <div class="fieldset">
                        <div class="form-group">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>주택보유정보 안내</label></div>
                                <a href="#" class="link_btn">생애최초 주택보유 기준</a>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>주소(처분 주택)<span class="point">*</span></label></div>
                                <a href="#" class="link_btn">기존주택 처분 의무</a>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp type2">
                                    <input type="text" class="krds-input p0 disabled type5" placeholder="주소 검색 버튼을 눌러주세요" title="주소(처분 주택)" disabled>
                                    <button type="button" class="area_btn blue">주소검색</button>
                                </div>
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0" value="1001동 1101호" title="상세주소">
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>처분 기한 ( 3 )년</label></div>
                            </div>
                            <div class="form-conts">
                                <a href="#" class="link_btn">분양권 정의</a>
                                <a href="#" class="link_btn">입주권 정의</a>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list">
                                    <li>보전/상환용도의 경우 주택 보유 시(분양권 또는 입주권 포함) 진행이 불가합니다.</li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>분양권(또는 입주권) 여부<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="presale00" name="presale" class="radio" checked>
                                        <label for="presale00">아니오</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="presale01" name="presale" class="radio">
                                        <label for="presale01">예</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>생애최초 주택구입 여부<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="firsthome00" name="firsthome" class="radio" checked>
                                        <label for="firsthome00">아니오</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="firsthome01" name="firsthome" class="radio">
                                        <label for="firsthome01">예</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>전세사기 피해여부<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="fraud00" name="fraud" class="radio" checked>
                                        <label for="fraud00">아니오</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="fraud01" name="fraud" class="radio">
                                        <label for="fraud01">예</label>
                                    </div>
                                </div>
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="fraudSub00" name="fraudSub" class="radio" disabled>
                                        <label for="fraudSub00">신규주택 구입</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="fraudSub01" name="fraudSub" class="radio" disabled>
                                        <label for="fraudSub01">임차주택낙찰</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list importance">
                                    <li>오피스텔의 경우, 신청일 현재 전입(임차권등기)이 되어있지 않은 경우 대출실행 후 1개월 이내에 전입해야 합니다</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn" disabled>저장</button>
            </div>
