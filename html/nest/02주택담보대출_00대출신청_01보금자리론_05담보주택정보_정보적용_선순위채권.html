<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="pro_anagement_cont">
                    <div class="step_cont">
                        <span class="blue">5단계</span> / 9단계
                    </div>
                    <div class="step_list_cont type1 step5">
                        <ol class="krds-step-wrap">
                            <li class="done">
                                <span>
                                    <span class="tit">고객정보 확인</span>
                                </span>
                            </li>
                            <li class="done">
                                <span>
                                    <span class="tit">정보제공동의</span>
                                </span>
                            </li>
                            <li class="done">
                                <span>
                                    <span class="tit">신용정보확인</span>
                                </span>
                            </li>
                            <li class="active">
                                <span>
                                    <em class="sr-only">현재단계</em>
                                    <span class="tit">담보주택정보</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">인적사항</span>
                                </span>
                            </li>
                        </ol>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont">
                    <div class="krds_accordion_area">
                        <div class="krds-accordion">
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button type="button" class="btn-accordion">기본정보</button>
                                </h2>
                            </div>
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button type="button" class="btn-accordion">주택유형 및 시세</button>
                                </h2>
                            </div>
                            <div class="accordion-item active">
                                <h2 class="accordion-header">
                                    <button type="button" class="btn-accordion active" aria-controls="accSenior">선순위채권</button>
                                </h2>
                                <div id="accSenior" class="accordion-collapse collapse" aria-labelledby="accSenior">
                                    <div class="accordion-body">
                                        <div class="com_info_list_cont bg">
                                            <ul class="list">
                                            <li>
                                                <div class="cont">
                                                    <div class="box">
                                                        <div class="tit">선순위여부</div>
                                                    </div>
                                                    <div class="box">
                                                        <div class="txt">없음/있음</div>
                                                    </div>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="cont">
                                                    <div class="box">
                                                        <div class="tit">전세권</div>
                                                    </div>
                                                    <div class="box">
                                                        <div class="txt">0건 / 0원</div>
                                                    </div>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="cont">
                                                    <div class="box">
                                                        <div class="tit">주택도시기금</div>
                                                    </div>
                                                    <div class="box">
                                                        <div class="txt">0건 / 0원</div>
                                                    </div>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="cont">
                                                    <div class="box">
                                                        <div class="tit">국가유공자 나라사랑 대출</div>
                                                    </div>
                                                    <div class="box">
                                                        <div class="txt">0건 / 0원</div>
                                                    </div>
                                                </div>
                                            </li>
                                            <li>
                                                <div class="cont">
                                                    <div class="box">
                                                        <div class="tit">보금자리론</div>
                                                    </div>
                                                    <div class="box">
                                                        <div class="txt">0건 / 0원</div>
                                                    </div>
                                                </div>
                                            </li>
                                            </ul>
                                        </div>
                                        <div class="btn_cont">
                                            <button type="button" class="com_btn blue org">수정</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <a href="#" class="btn-accordion">임대차 정보</a>
                                </h2>
                            </div>
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button type="button" class="btn-accordion" disabled>무상거주인 정보</button>
                                </h2>

                <button type="button" class="com_btn" disabled>다음</button>
