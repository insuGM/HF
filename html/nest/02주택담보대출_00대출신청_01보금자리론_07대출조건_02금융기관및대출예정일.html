<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents none_bg">
                <div class="pro_anagement_cont gap">
                    <div class="main_tit_area m0">
                        <h2 class="tit">금융기관 및 대출예정일</h2>
                    </div>
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>영업점<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp type2">
                                    <input type="text" class="krds-input p0 disabled type6" placeholder="영업점 검색을 눌러주세요" title="영업점" disabled>
                                    <button type="button" class="area_btn blue">영업점 검색</button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>대출 예정일<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts calendar-conts">
                                <div class="calendar-input">
                                    <input type="text" class="krds-input datepicker cal" placeholder="YYYY.MM.DD" title="대출 예정일">
                                    <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                        <span class="sr-only">달력 열기</span>
                                        <i class="svg-icon ico-calendar"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list importance">
                                    <li>담보주택을 매매하시며 대출을 받으시는 경우에는 잔금 예정일을 입력해주세요 대출예정일이 신청일로부터 50일 ~90일 이내인 경우 신청 가능합니다.</li>
                                </ul>
                                <a href="#" class="link_btn">담보주택이란</a>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>PUSH, SMS 수신 여부<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="krds-check-area">
                                    <div class="krds-form-check">
                                        <input type="checkbox" id="push00">
                                        <label for="push00">납입일자 안내</label>
                                    </div>
                                    <div class="krds-form-check">
                                        <input type="checkbox" id="push01">
                                        <label for="push01">납입금액 안내</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>납입일자 안내</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="com_list_bg_cont gap">
                                    <div class="com_list_bg_area">
                                        <p class="bg_txt">원리금 납입일자를 안내해드리는 서비스</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>납입금액 안내</label></div>
                                <a href="#" class="link_btn">DSR란</a>
                            </div>
                            <div class="form-conts">
                                <div class="com_list_bg_cont gap">
                                    <div class="com_list_bg_area">
                                        <ul class="krds-info-list decimal">
                                            <li>원리금 상환날짜와 금액을 안내해드리는 서비스</li>
                                            <li>DSR(총부채원리금상환비율)이 70%를 초과하는 보금자리론 이용고객에게는 서비스 신청여부에 관계없이 '납입금액안내'서비스를 제공합니다.</li>
                                            <li>향후 서비스 이용내용변경을 원할 경우, 홈페이지에서 변경하실 수 있습니다.</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page fixed">
                <button type="button" class="com_btn" disabled>저장</button>
            </div>

        </div>
    </div>

    <div data-include="../inc/footer.html"></div>
