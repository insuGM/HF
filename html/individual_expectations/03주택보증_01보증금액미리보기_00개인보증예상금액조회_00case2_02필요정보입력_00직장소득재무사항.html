<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="pro_anagement_cont">
                    <div class="step_cont">
                        <span class="blue">3단계</span> / 4단계
                    </div>
                    <div class="step_list_cont type1 step3 hf-step-list-cont">
                        <ol class="krds-step-wrap">
                            <li class="done">
                                <span>
                                    <span class="tit">개인정보동의</span>
                                </span>
                            </li>
                            <li class="active">
                                <span>
                                    <em class="sr-only">현재단계</em>
                                    <span class="tit">필요정보 입력</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">신청정보 확인</span>
                                </span>
                            </li>
                        </ol>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont type2">
                    <div class="hf-sel-product-box">
                        <p class="hf-sel-product-tit">선택한 보증상품</p>
                        <p class="hf-sel-product-txt">일반중도금보증</p>
                    </div>
                </div>
                <div class="pro_anagement_cont">
                    <div class="krds_accordion_area">
                        <div class="krds-accordion">
                            <div class="accordion-item active">
                                <h2 class="accordion-header">
                                    <button type="button" id="acc01Header" class="btn-accordion active" aria-controls="acc01Collapse">직장 · 소득 · 재무사항</button>
                                </h2>
                                <div id="acc01Collapse" class="accordion-collapse collapse" aria-labelledby="acc01Header">
                                    <div class="accordion-body">
                                        <div class="pro_anagement_list_area">
                                            <ul class="list">
                                                <li>
                                                    <div class="cont">
                                                        <div class="fieldset">
                                                            <div class="form-group none_bg">
                                                                <div class="form-tit-cont">
                                                                    <div class="form-tit type1">
                                                                        <label>연소득
                                                                        <span class="point">*</span>
                                                                        </label>
                                                                        <button type="button" class="com_label_btn white">추정소득 계산기</button>
                                                                    </div>
                                                                </div>
                                                                <div class="form-conts">
                                                                    <div class="form-text">
                                                                        <div class="text">
                                                                            <div class="num">영</div>
                                                                            <div class="txt">원</div>
                                                                        </div>
                                                                    </div>
                                                                    <div class="form-inp">
                                                                        <input type="text" id="inp_income" class="krds-input padding-right" placeholder="0" title="inp_income 금액을 입력해 주세요.">
                                                                        <div class="txt">원</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </li>
                                                <li>
                                                    <div class="cont">
                                                        <div class="fieldset">
                                                            <div class="form-group none_bg">
                                                                <div class="form-tit-cont">
                                                                    <div class="form-tit type1">
                                                                        <label>부채금액
                                                                        <span class="point">*</span>
                                                                        </label>
                                                                        <button type="button" class="com_label_btn white">부채금액 조회</button>
                                                                    </div>
                                                                </div>
                                                                <div class="form-conts">
                                                                    <div class="form-text">
                                                                        <div class="text">
                                                                            <div class="num">영</div>
                                                                            <div class="txt">원</div>
                                                                        </div>
                                                                    </div>
                                                                    <div class="form-inp">
                                                                        <input type="text" id="inp_debt" class="krds-input padding-right" placeholder="0" title="inp_debt 금액을 입력해 주세요.">
                                                                        <div class="txt">원</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </li>
                                                <li>
                                                    <div class="cont">
                                                        <div class="fieldset">
                                                            <div class="form-group none_bg">
                                                                <div class="form-tit-cont">
                                                                    <div class="form-tit type1">
                                                                        <label>직업
                                                                        <span class="point">*</span>
                                                                        </label>
                                                                    </div>
                                                                </div>
                                                                <div class="form-conts">
                                                                    <div class="form-inp type2">
                                                                        <input type="text" id="inp_job" class="krds-input p0 type1" placeholder="검색버튼을 눌러주세요" title="검색버튼을 눌러주세요" readonly>
                                                                        <button type="button" class="area_btn">검색</button>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </li>
                                            </ul>
                                        </div>
                                        <div class="btn_cont">
                                            <button type="button" class="com_btn m0" disabled>저장</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="accordion-item">
                                <h2 class="accordion-header">
                                    <button type="button" id="acc02Header" class="btn-accordion" aria-controls="acc02Collapse">보증대상주택 정보</button>
                                </h2>
                                <div id="acc02Collapse" class="accordion-collapse collapse" aria-labelledby="acc02Header">
                                    <div class="accordion-body">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="btn_cont page hf-btn-area">
                    <button type="button" class="com_btn blue2 hf-btn-primary js-btn-next" disabled>다음</button>
                </div>
            </div>

        </div>
