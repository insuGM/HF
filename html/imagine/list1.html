<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                                    <div class="pro_anagement_cont">
                        <div class="step_cont">
                            <span class="blue">1단계</span> / 3단계
                        </div>
                        <div class="step_list_cont type1">
                            <ol class="krds-step-wrap">
                                <li class="active">
                                    <span>
                                        <em class="sr-only">현재단계</em>
                                        <span class="tit">정보동의</span>
                                    </span>
                                </li>
                                <li>
                                    <span>
                                        <span class="tit">대출계좌 및 납부금액확인</span>
                                    </span>
                                </li>
                                <li>
                                    <span>
                                        <span class="tit">납부내역 확인</span>
                                    </span>
                                </li>
                            </ol>
                        </div>
                    </div>
                    <div class="bg_line"></div>
                    <div class="pro_anagement_cont">
                        <div class="pro_anagement_chk_list_area">
                            <div class="fieldset">
                                <div class="form-group none_bg">
                                    <div class="form-conts">
                                        <div class="krds-check-area chk-column">
                                            <div class="krds-form-check all">
                                                <input type="checkbox" id="chk_additional_1">
                                                <label for="chk_additional_1">
                                                    [전체] 가상계좌 상환신청 동의 
                                                    <button type="button" data-pop="com_pop11" class="btn">전체보기</button>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group none_bg">
                                    <div class="form-conts">
                                        <div class="krds-check-area chk-column">
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="chk_additional_2">
                                                <label for="chk_additional_2">
                                                    [필수] 자동이체일인 경우나, 원리금연체 중인 경우에 상환신청을 하시면 중복하여 출금될 수 있습니다. (중복출금시 익영업일 환출)
                                                </label>
                                            </div>
                                        </div>
                                        <div class="krds-check-area chk-column">
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="chk_additional_3">
                                                <label for="chk_additional_3">
                                                    [필수] 계좌잔액이 입금하고자 하는 금액 이상이어야 하며, 상환신청 후에는 취소가 불가능합니다.
                                                </label>
                                            </div>
                                        </div>
                                        <div class="krds-check-area chk-column">
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="chk_additional_4">
                                                <label for="chk_additional_4">
                                                    [필수] 상환처리는 ① 지연배상금, ② 이자, ③ 원금 순으로 진행됩니다.
                                                </label>
                                            </div>
                                        </div>
                                        <div class="krds-check-area chk-column">
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="chk_additional_5">
                                                <label for="chk_additional_5">
                                                    [필수] (조기상환) 조기상환을 하시는 경우에는 조기상환금액에 대하여 상환 전일까지의 이자를 함께 상환하셔야 합니다. 
                                                </label>
                                            </div>
                                        </div>
                                        <div class="krds-check-area chk-column">
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="chk_additional_6">
                                                <label for="chk_additional_6">
                                                    [필수](조기상환) 대출일로부터 경과기간에 따라 조기상환수수료가 부과될 수 있습니다. 
                                                </label>
                                            </div>
                                        </div>
                                        <div class="krds-check-area chk-column">
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="chk_additional_7">
                                                <label for="chk_additional_7">
                                                    [필수](조기상환) 원리금 1회분 미만 금액이 선납된 경우 잔여 원리금을 상환해야 조기상환이 가능합니다. 
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="com_list_bg_cont">
                        <div class="com_list_bg_area">
                            <ul class="krds-info-list decimal">
                                <li>이 화면에서는 원금 및 이자 납부, 중도상환을 하실 수 있습니다. <br>(평일 및 휴무일 08:30 ~ 23:00 이용 가능)</li>
                                <li>여러 건의 가상계좌 거래가 필요하신 경우 공사 영업점으로 문의하시기 바랍니다.</li>
                                <li>가상계좌 상환처리 결과는 익일 거래내역 조회 화면에서 확인 가능합니다.</li>
                                <li>가상계좌 입금 시 본인 계좌의 이체한도를 먼저 확인하시기 바랍니다.</li>
                            </ul>
                        </div>
                    </div>
                    <div class="btn_cont page2">
                        <button type="button" class="com_btn" disabled>다음</button>
                    </div>

        <div class="com_pop_cont">

                내용
