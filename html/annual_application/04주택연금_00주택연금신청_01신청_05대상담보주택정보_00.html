<!DOCTYPE html>
<html lang="ko">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko">
    <meta property="og:site_name" content="한국주택금융공사">
    <meta property="og:updated_time" content="">
    <meta name="twitter:card" content="summary">
    <title>한국주택금융공사</title>

    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_common/cms.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/cms-common.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/breadcrumb.widget.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/dictionary-of-terms.widget.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/dictionary-of-terms-sub.widget.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/cms-common.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/layout.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/font.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/slick.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/board.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_common/voc.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/common01.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/faq01.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/thumb01.css">

    <script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
    <script defer type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>

    <link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
    <link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">

    <script type="text/javascript" src="/resources/js/krds/krds.js"></script>
    <script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
</head>

<body>

    <div class="wrapper sub" id="app">
        <div data-include="../inc/header.html"></div>

        <div id="container">
            <div class="container_in">

                <div class="contents">
                    <div class="pro_anagement_cont">
                        <div class="step_cont">
                            <span class="blue">6단계</span> / 8단계
                        </div>
                        <div class="step_list_cont type1 step2 hf-step-list-cont">
                            <ol class="krds-step-wrap">
                                <li class="done">
                                    <span>
                                        <span class="tit">인적사항</span>
                                    </span>
                                </li>
                                <li class="active">
                                    <span>
                                        <em class="sr-only">현재단계</em>
                                        <span class="tit">대상 담보주택 정보</span>
                                    </span>
                                </li>
                                <li>
                                    <span>
                                        <span class="tit">신청내용</span>
                                    </span>
                                </li>
                            </ol>
                        </div>
                    </div>
                </div>

                <div class="bg_line"></div>

                <div class="contents">
                    <div class="hf-form-section">
                        <div class="fieldset">
                            <!-- 주택유형 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>주택유형<span class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <button type="button" data-pop="com_pop" class="slt_btn krds-select"
                                        title="주택유형 선택 팝업 열기">아파트</button>
                                </div>
                            </div>
                            <!-- 가입주택주소 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>가입주택주소<span class="point">*</span></label></div>
                                    <button type="button" class="com_label_btn white">거주지 동일</button>
                                </div>
                                <div class="form-conts">
                                    <div class="form-inp type2">
                                        <input type="text" class="krds-input p0 disabled type3" title="우편번호" disabled>
                                        <button type="button" class="area_btn blue">주소 시세 검색</button>
                                    </div>
                                    <div class="form-inp">
                                        <input type="text" class="krds-input p0 disabled"
                                            value="서울특별시 강남구 테헤란로 233 큰길타워" disabled title="기본주소" disabled>
                                    </div>
                                    <div class="form-inp">
                                        <input type="text" class="krds-input p0" placeholder="입력해 주세요" title="상세주소">
                                    </div>
                                </div>
                            </div>
                            <!-- 주택가격 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label for="housePrice">주택가격</label></div>
                                </div>
                                <div class="form-conts cunt">
                                    <div class="form-cunt">
                                        <div class="form-text">
                                            <div class="text">
                                                <div class="num">영</div>
                                                <div class="txt">원</div>
                                            </div>
                                        </div>
                                        <div class="form-inp">
                                            <input type="text" id="housePrice" class="krds-input" placeholder="0">
                                            <div class="txt">원</div>
                                        </div>
                                        <ul class="krds-info-list type2">
                                            <li><span class="num">*</span>시세가 조회되지 않는 경우에는 예상주택가격을 입력하십시오. 주택가격은 향후 감정평가
                                                금액에 따라 달라질 수 있으며 그에 따라 월지급금도 변동될 수 있습니다.</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                            <!-- 가입주택 부부공동 소유여부 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>가입주택 부부공동 소유여부<span class="point">*</span></label>
                                    </div>
                                </div>
                                <div class="form-conts">
                                    <div class="es_chip_wrap">
                                        <div class="es_chip">
                                            <input type="radio" id="coOwn1" name="coOwn" checked>
                                            <label for="coOwn1">소유안함</label>
                                        </div>
                                        <div class="es_chip">
                                            <input type="radio" id="coOwn2" name="coOwn">
                                            <label for="coOwn2">소유함</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 부부 주택공시가 합산 12억 초과 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>부부 주택공시가 합산 12억 초과<span class="point">*</span></label>
                                    </div>
                                </div>
                                <div class="form-conts">
                                    <div class="es_chip_wrap">
                                        <div class="es_chip">
                                            <input type="radio" id="over12_1" name="over12" checked>
                                            <label for="over12_1">초과안함</label>
                                        </div>
                                        <div class="es_chip">
                                            <input type="radio" id="over12_2" name="over12">
                                            <label for="over12_2">초과함</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 현재 재개발, 재건축 여부 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>현재 재개발, 재건축 여부<span class="point">*</span></label>
                                    </div>
                                </div>
                                <div class="form-conts">
                                    <div class="es_chip_wrap">
                                        <div class="es_chip">
                                            <input type="radio" id="redev1" name="redev" checked>
                                            <label for="redev1">없음</label>
                                        </div>
                                        <div class="es_chip">
                                            <input type="radio" id="redev2" name="redev">
                                            <label for="redev2">있음</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 경매, 압류, 가압류, 가처분 등 여부 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>경매, 압류, 가압류, 가처분 등 여부<span
                                                class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="es_chip_wrap">
                                        <div class="es_chip">
                                            <input type="radio" id="auction1" name="auction">
                                            <label for="auction1">없음</label>
                                        </div>
                                        <div class="es_chip">
                                            <input type="radio" id="auction2" name="auction" checked>
                                            <label for="auction2">있음</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 저당권 설정여부 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>저당권 설정여부<span class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="es_chip_wrap">
                                        <div class="es_chip">
                                            <input type="radio" id="mortgage1" name="mortgage">
                                            <label for="mortgage1">없음</label>
                                        </div>
                                        <div class="es_chip">
                                            <input type="radio" id="mortgage2" name="mortgage" checked>
                                            <label for="mortgage2">있음</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="hf-sub-field">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>저당권 설정금액<span class="point">*</span></label></div>
                                    </div>
                                    <p class="hf-money-hangul">일억육천구백오십오만오천 <span class="unit">원</span></p>
                                    <div class="form-inp hf-money">
                                        <input type="text" class="krds-input p0" value="169,555,000" title="저당권 설정금액">
                                        <span class="unit">원</span>
                                    </div>
                                </div>
                            </div>
                            <!-- 전세권 설정여부 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>전세권 설정여부<span class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="es_chip_wrap">
                                        <div class="es_chip">
                                            <input type="radio" id="jeonse1" name="jeonse">
                                            <label for="jeonse1">없음</label>
                                        </div>
                                        <div class="es_chip">
                                            <input type="radio" id="jeonse2" name="jeonse" checked>
                                            <label for="jeonse2">있음</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="hf-sub-field">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>전세권 설정금액<span class="point">*</span></label></div>
                                    </div>
                                    <p class="hf-money-hangul">일억육천구백오십오만오천 <span class="unit">원</span></p>
                                    <div class="form-inp hf-money">
                                        <input type="text" class="krds-input p0" value="169,555,000" title="전세권 설정금액">
                                        <span class="unit">원</span>
                                    </div>
                                </div>
                            </div>
                            <!-- 임대차계약여부 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>임대차계약여부<span class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="es_chip_wrap">
                                        <div class="es_chip">
                                            <input type="radio" id="lease1" name="lease" checked>
                                            <label for="lease1">없음</label>
                                        </div>
                                        <div class="es_chip">
                                            <input type="radio" id="lease2" name="lease">
                                            <label for="lease2">있음</label>
                                        </div>
                                    </div>
                                </div>

                                <div class="hf-sub-field">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>임차보증금액<span class="point">*</span></label></div>
                                    </div>
                                    <p class="hf-money-hangul">일억육천구백오십오만오천 <span class="unit">원</span></p>
                                    <div class="form-inp hf-money">
                                        <input type="text" class="krds-input p0" value="169,555,000" title="임차보증금액">
                                        <span class="unit">원</span>
                                    </div>
                                </div>
                            </div>
                            <!-- 부부합산 보유주택 수 -->
                            <div class="form-group">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label for="houseCount">부부합산 보유주택 수<span
                                                class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="form-inp">
                                        <input type="text" id="houseCount" class="krds-input p0" placeholder="입력해 주세요">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="btn_cont page hf-btn-area">
                    <button type="button" class="com_btn blue2">다음</button>
                </div>

            </div>
        </div>

        <div data-include="../inc/footer.html"></div>

    </div>

    <script type="text/javascript" src="/resources/js/include.js"></script>
</body>

</html>
