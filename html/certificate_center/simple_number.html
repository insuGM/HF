<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">
            <div class="contents com_sub">

                <div class="auth_cont simple_number_cont">
                  <div class="inner_box">
                    <div class="top_area">
                      <div class="title_area">
                        <h2 class="title">간편번호 인증</h2>
                        <div class="text">인증 버튼을 선택해 주세요.</div>
                      </div>
                      <div class="pin_display">
                          <div class="dot"></div>
                          <div class="dot"></div>
                          <div class="dot"></div>
                          <div class="dot"></div>
                          <div class="dot"></div>
                          <div class="dot"></div>
                      </div>
                      <div class="error_txt">
                        <div class="ico"><img src="/resources/images/sub/error_txt_ico.svg" alt=""></div>
                        <div class="txt">생년월일은 사용할 수 없습니다.</div>
                      </div>
                    </div>
                    <div class="bot_area">
                      <div class="keypad_area">
                        <button class="key" data-pop="com_pop1">1</button>
                        <button class="key" data-pop="com_pop2">2</button>
                        <button class="key">3</button>
                        <button class="key">4</button>
                        <button class="key">5</button>
                        <button class="key">6</button>
                        <button class="key">7</button>
                        <button class="key">8</button>
                        <button class="key">9</button>
                        <button class="key empty">재배열</button>
                        <button class="key">0</button>
                        <button class="key action" id="deleteBtn"><img src="/resources/images/sub/keypad_del.svg" alt="삭제"></button>
                      </div>
                    </div>
                  </div>
                </div>

            </div>
            <!-- //sub_con -->
        </div> <!-- //container_in -->
    </div>

    <div class="com_pop_wrap w_min type1">
        <div class="com_pop_cont">
            <div class="title_area">
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content">
                <div class="text_area">
                    <h2 class="tit">간편번호 등록이 <br>완료되었습니다.</h2>
                </div>
                <div class="btn_cont">
                  <button type="button" class="com_btn blue2 end">확인</button>
                </div>
            </div>
        </div>
    </div>

    <div class="com_pop_wrap w_min type2">
        <div class="com_pop_cont">
            <div class="title_area">
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content">
                <div class="text_area">
                    <h2 class="tit">간편번호가 <br>일치하지 않습니다.</h2>
                    <div class="txt">확인 후 다시 입력해 주세요.</div>
                </div>
                <div class="btn_cont">
                  <button type="button" class="com_btn blue2 end">확인</button>
                </div>
            </div>
        </div>
    </div>

</div> <!-- //wrap -->
