<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">
            <div class="contents com_sub">
               
              <div class="certificate_copy_cont">
                <div class="ico_area">
                  <div class="inner_box">
                    <div class="box ico_box">
                      <div class="ico">
                        <img src="/resources/images/sub/mobile_copy_ico.svg" alt="">
                      </div>
                      <div class="txt">휴대폰</div>
                    </div>
                    <div class="box text_box">
                      <div class="ico">
                        <img src="/resources/images/sub/copy_arrow_ico.svg" alt="">
                      </div>
                      <div class="txt">공인인증서 복사</div>
                    </div>
                    <div class="box ico_box">
                      <div class="ico">
                        <img src="/resources/images/sub/pc_copy_ico.svg" alt="">
                      </div>
                      <div class="txt">PC</div>
                    </div>
                  </div>
                </div>
                <div class="fieldset">
                    <!-- 폼그룹 -->
                    <div class="form-group none_bg">
                        <div class="form-tit">
                            <label for="verification_code2_1">
                                인증번호
                            </label>
                        </div>
                        <div class="form-conts">
                            <div class="number_area">
                                <div class="inp_area">
                                      <input type="text" id="verification_code2_1" class="krds-input" placeholder="숫자 4자리" value="" data-pop="com_pop11">
                                </div>
                                <span class="txt">-</span>
                                <div class="inp_area">
                                    <input type="text" id="verification_code2_2" class="krds-input" placeholder="숫자 4자리" value="">
                                </div>
                                <span class="txt">-</span>
                                <div class="inp_area">
                                    <input type="text" id="verification_code2_3" class="krds-input" placeholder="숫자 4자리" value="">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- //폼그룹 -->
                </div> 
                <div class="info_list_area">
                  <!-- krds-info-list -->
                  <ol class="krds-info-list ordered type2">
                    <li class="title">스마트폰에 저장되어 있는 공동인증서를 <br>PC로 복사하여 <br>금융서비스를 이용하실 수 있습니다.</li>
                    <li><span class="num">1</span>PC에서 한국주택금융공사의 인터넷 금융서비스를 접속합니다.</li>
                    <li><span class="num">2</span>인증/보안 센터 &gt; 공동인증서 &gt; 인증서 복사 &gt; 휴대폰-PC 복사를 클릭 후 인증서 비밀번호를 입력합니다. </li>
                    <li><span class="num">3</span>생성된 인증번호(12자리)를 인증번호 입력란에 입력 후 인증서 비밀번호를 다시 한번 입력합니다.</li>
                  </ol>
                </div>
              </div>
                
            </div>
            <!-- //sub_con -->
        </div> <!-- //container_in -->

                    </button> -->
