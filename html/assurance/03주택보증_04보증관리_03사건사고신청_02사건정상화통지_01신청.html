    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="krds-tab-area layer list">
                    <div class="tab fill full line">
                        <ul role="tablist">
                            <li id="tabInfo01" class="active" aria-controls="tabpanelInfo01" aria-selected="true">
                                <button type="button" class="btn-tab">사고 정상화통지</button>
                            </li>
                            <li id="tabInfo02" aria-controls="tabpanelInfo02">
                                <button type="button" class="btn-tab">사고 사유발생 통지</button>

                        </ul>
                    </div>

                    <div class="tab-conts-wrap type1">
                        <div id="tabpanelInfo01" aria-labelledby="tabInfo01" class="tab-conts active" role="tabpanel">
                            <!-- 보증내용 -->
                            <div class="hf-form-section">
                                <div class="hf-form-section-tit">보증내용</div>
                                <div class="fieldset">
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label for="bondCreditor">보증채권자</label></div>
                                        </div>
                                        <div class="form-conts">
                                            <div class="form-inp">
                                                <input type="text" id="bondCreditor" class="krds-input p0" value="김주택" disabled>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label for="bondNo">보증번호</label></div>
                                        </div>
                                        <div class="form-conts">
                                            <div class="form-inp">
                                                <input type="text" id="bondNo" class="krds-input p0" value="THD-1234-123456" disabled>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label>보증기간</label></div>
                                        </div>
                                        <div class="form-conts calendar-conts">
                                            <div class="calendar-input">
                                                <ul class="input-group range set">
                                                    <li>
                                                        <input type="text" class="krds-input datepicker" value="2026.05.09" title="보증기간 시작날짜 입력" disabled>
                                                    </li>
                                                    <li class="mark">-</li>
                                                    <li>
                                                        <input type="text" class="krds-input datepicker" value="2026.05.12" title="보증기간 종료날짜 입력" disabled>
                                                <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                                    <span class="sr-only">달력 열기</span>
                                                    <i class="svg-icon ico-calendar"></i>
                                                </button>
                                                    </li>
                                                </ul>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label for="leaseDeposit">임대차보증금액</label></div>
                                        </div>
                                        <div class="form-conts cunt">
                                            <div class="form-cunt">
                                                <div class="form-text">
                                                    <div class="text">
                                                        <div class="num">일억오천만</div>
                                                        <div class="txt">원</div>
                                                    </div>
                                                </div>
                                                <div class="form-inp">
                                                    <input type="text" id="leaseDeposit" class="krds-input" value="150,000,000" disabled>
                                                    <div class="txt">단위</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label for="leaseObject">임대차목적물</label></div>
                                        </div>
                                        <div class="form-conts">
                                            <div class="form-inp">
                                                <input type="text" id="leaseObject" class="krds-input p0" value="부산광역시 남구 문헌금융로 40 국제금융센터" disabled>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg_line"></div>

                            <!-- 사고사유 -->
                            <div class="hf-form-section">
                                <div class="hf-form-section-tit">사고사유</div>
                                <div class="fieldset">
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label for="accidentReason">사고사유</label></div>
                                        </div>
                                        <div class="form-conts">
                                            <div class="textarea-wrap">
                                                <textarea id="accidentReason" class="krds-input p0" rows="3" disabled>임대차 계약이 해지(경･공매시 배당요구에 따른 해지 제외) 또는 종료된 후 1개월이 경과하였음에도 보증채권자가 임대차보증금을 반환받지 못한 때</textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="bg_line"></div>

                            <!-- 전세지킴보증 사고사유 발생시 준수사항 -->
                            <div class="hf-form-section">
                                <div class="hf-form-section-tit">전세지킴보증 사고사유 발생시 준수사항</div>
                                <div class="fieldset">
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label>정상화사유발생일자<span class="point">*</span></label></div>
                                        </div>
                                        <div class="form-conts calendar-conts">
                                            <div class="calendar-input">
                                                <input type="text" id="normDate" class="krds-input datepicker cal" value="2026.05.09" placeholder="YYYY.MM.DD">
                                                <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                                    <span class="sr-only">달력 열기</span>
                                                    <i class="svg-icon ico-calendar"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label>정상화 사유<span class="point">*</span></label></div>
                                        </div>
                                        <div class="form-conts">
                                            <div class="chip-wrap cunt auto">
                                                <div class="krds-form-chip type1">
                                                    <input type="radio" id="normReason1" name="normReason" checked class="radio">
                                                    <label for="normReason1">기타</label>
                                                </div>
                                                <div class="krds-form-chip type1">
                                                    <input type="radio" id="normReason2" name="normReason" class="radio">
                                                    <label for="normReason2">임대인보증금전액반환</label>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group none_bg">
                                        <div class="form-tit-cont">
                                            <div class="form-tit"><label for="normDetail">정상화 상세 사유<span class="point">*</span></label></div>
                                        </div>
                                        <div class="form-conts">
                                            <div class="textarea-wrap">
                                                <textarea id="normDetail" class="krds-input" placeholder="입력해 주세요"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="tabpanelInfo02" aria-labelledby="tabInfo02" class="tab-conts" role="tabpanel">
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page hf-btn-area">

                        </div>
