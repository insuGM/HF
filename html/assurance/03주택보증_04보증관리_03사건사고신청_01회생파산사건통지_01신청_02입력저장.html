                                            </div>
                                        </div>

                                            <div class="chip-wrap cunt">

                                                </div>
                                                <div class="krds-form-chip type1">
                                                    <input type="radio" id="execDiv02" name="execDiv" class="radio">

                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- 사건번호 -->
                                    <div class="form-group">
                                        <div class="form-tit-cont">
                                            <div class="form-tit">
                                                <label for="caseNoFront">사건번호<span class="point">*</span></label>

                                        </div>

                                        </div>
                                    </div>

                                        </div>

                                            <div class="form-inp type2">
                                                <input type="text" id="courtName" class="krds-input p0 type2" disabled>
