    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_common/voc.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/common01.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/faq01.css">

    <!-- JavaScript 파일들 -->
    <script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
    <script defer type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>
    
    <!-- !추가부분 -->
    <link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
    <link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">

    <script type="text/javascript" src="/resources/js/krds/krds.js"></script>
    <script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>

    <!--// !추가부분 -->

<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">
            <div class="contents com_sub">

                <div class="login_method_cont user_register_cont">
                    <div class="step_list_area">
                        <ul class="list">
                            <li class="complete">
                                <div class="box">
                                    <span class="num"><i class="svg-icon ico-angle down"></i><span class="sr-only">완료</span></span>
                                    <div class="txt">본인확인</div>
                                </div> 
                            </li>
                            <li class="on">
                                <div class="box">
                                    <span class="num">2</span>
                                    <div class="txt">정보입력<span class="sr-only">현재 정보입력 페이지입니다.</span></div>
                                </div> 
                            </li>
                        </ul>
                    </div>
                    <div class="sub_tit_area">
                        <h2 class="tit">마지막으로 고객님의 <br>정보를 알려주세요</h2>
                    </div>
                    <div class="fieldset">
                        <!-- 폼그룹 -->
                        <div class="form-group">
                            <div class="form-tit">
                                <label for="consult_name1">
                                    <span class="point">*</span>
                                    이름
                                </label>
                            </div>
                            <div class="form-conts">
                                <input type="text" id="consult_name1" class="krds-input" placeholder="이름" value="홍길동" disabled>
                            </div>
                        </div>
                        <!-- //폼그룹 -->
                        <!-- 폼그룹 -->
                        <div class="form-group">
                            <div class="form-tit">
                                <label for="consult_name2">
                                    <span class="point">*</span>
                                    주민등록번호(외국인등록번호)
                                </label>
                            </div>
                            <div class="form-conts">
                                <div class="number_area">
                                    <div class="inp_area">
                                         <input type="text" id="consult_name2" class="krds-input" placeholder="생년월일 8자리" value="260101" disabled>
                                    </div>
                                    <span class="txt">-</span>
                                    <div class="inp_area sty2">
                                        <input type="text" id="consult_name2_2" class="krds-input" placeholder="뒤 7자리" value="">
                                        <button type="button" class="krds-btn small icon">
                                            <span class="sr-only">입력한 비밀번호 보기</span>
                                            <i class="svg-icon ico-keypad"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- //폼그룹 -->
                        <!-- 폼그룹 -->
                        <div class="form-group">
                            <div class="form-tit">
                                <label for="consult_name3">
                                    <span class="point">*</span>
                                    휴대폰전화번호
                                </label>
                            </div>
                            <div class="form-conts">
                                <input type="text" id="consult_name3" class="krds-input" placeholder="-없이 숫자만" value="01012341234" disabled>
                            </div>
                        </div>
                        <!-- //폼그룹 -->
                    </div>
                    <div class="btn_cont">
                        <button type="button" data-pop="com_pop8" class="com_btn blue2">본인인증</button>
                    </div>
                </div>

            </div>
            <!-- //sub_con -->
        </div> <!-- //container_in -->
    </div>
    <div data-include="../inc/footer.html"></div>

    <!-- 사용자등록 정보입력 본인확인대체인증 팝업 -->
    <div class="com_pop_wrap type8">
        <div class="com_pop_cont">
            <div class="title_area">
                <h2 class="title">본인인증</h2>
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content pt0">
                <div class="login_method_cont">
                    <div class="auth_area">
                        <div class="etc_txt_area sty2">
                            <ul class="list">
                                <li>본인정보 확인을 위해 아래 수단으로 <br>인증을 진행해 주세요</li>
                            </ul>
                        </div>
                        <div class="auth_btn_area">
                            <ul class="list">
                                <li>
                                    <button type="button" data-pop="com_pop9" class="auth_btn" title="공동인증서로 본인인증">
                                        <span class="ico"><img src="/resources/images/sub/auth_ico_cavity.svg" alt="공동인증서"></span>
                                        <span class="txt">공동인증서</span>
                                    </button>
                                </li>
                                <li>
                                    <button type="button" data-pop="com_pop10" class="auth_btn" title="금융인증서로 본인인증">
                                        <span class="ico"><img src="/resources/images/sub/auth_ico_finance.svg" alt="금융인증서"></span>
                                        <span class="txt">금융인증서</span>
                                    </button>
                                </li>
                                <li>
                                    <button type="button" data-pop="com_pop11" class="auth_btn" title="모바일 신분증으로 본인인증">
                                        <span class="ico"><img src="/resources/images/sub/auth_ico_mobid.svg" alt="모바일 신분증"></span>
                                        <span class="txt">모바일 신분증</span>
                                    </button>
                                </li>
                            </ul>
                        </div> 
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 로그인 사용자등록 정보입력 본인확인대체 인증 완료 팝업 -->
    <div class="com_pop_wrap w_min type9">
        <div class="com_pop_cont">
            <div class="title_area">
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content">
                <div class="text_area">
                    <div class="tit">
                       인증서가 정상적으로 <br>
                       등록되었습니다.
                    </div>
                </div>
                <div class="btn_cont">
                    <button type="button" class="com_btn blue2 end">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 로그인 사용자등록 정보입력 본인확인대체 인증 실패 팝업 -->
    <div class="com_pop_wrap w_min type10">
        <div class="com_pop_cont">
            <div class="title_area">
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content">
                <div class="text_area">
                    <div class="tit">
                        고객님의 정보가 <br>
                        일치하지 않습니다. 
                    </div>
                    <div class="txt">확인 후 다시 시도해 주세요로 수정 부탁드립니다.</div>
                </div>
                <div class="btn_cont">
                    <button type="button" class="com_btn blue2 end">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 로그인 사용자등록 정보입력 본인확인대체 인증 이동 팝업 -->
    <div class="com_pop_wrap w_min type11">
        <div class="com_pop_cont">
            <div class="title_area"> 
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content">
                <div class="text_area">
                    <div class="tit">
                        HF 간편인증을 등록하시면 <br>
                        편리한 서비스 이용이 가능합니다.
                    </div>
                    <div class="txt">인증 등록 화면으로 이동할까요?</div>
                </div>
                <div class="btn_cont">
                    <a href="../login/user_register.html" class="com_btn blue2">HF 간편인증 등록</a>
                </div>
            </div>
        </div>
    </div>

</div> <!-- //wrap -->

</body>
