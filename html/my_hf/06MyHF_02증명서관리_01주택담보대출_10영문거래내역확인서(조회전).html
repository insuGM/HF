    <body>
        <div class="wrapper sub" id="app">
            <div data-include="../inc/header.html"></div>
            <div id="container">
                <div class="container_in">
                    <div class="contents">
                        <div class="pro_anagement_cont">
                            <div class="fieldset type1 cont_line">
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>발급 증명서</label></div>
                                    </div>
                                    <div class="form-conts">
                                        <button type="button" class="slt_btn type1 data" data-pop="com_pop">
                                            <div class="sub">주택담보대출</div>
                                            영문 거래내역확인서
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="fieldset type1">
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>대출 계좌번호<span class="point">*</span></label></div>
                                    </div>
                                    <div class="form-conts">
                                        <button type="button" class="slt_btn type1 data" data-pop="com_pop_acc">
                                            <div class="sub">대출계좌</div>
                                            0118******* u-보금자리론
                                        </button>
                                    </div>
                                </div>
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>발급 사유<span class="point">*</span></label></div>
                                    </div>
                                    <div class="form-conts">
                                        <button type="button" class="slt_btn data" data-pop="com_pop_sel">기타</button>
                                    </div>
                                </div>
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>사유 입력<span class="point">*</span></label></div>
                                    </div>
                                    <div class="form-conts">
                                        <div class="textarea-wrap">
                                            <textarea class="krds-input p0" rows="5" placeholder="입력해 주세요."></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>영문 이름<span class="point">*</span></label></div>
                                    </div>
                                    <div class="form-conts">
                                        <div class="form-inp">
                                            <input type="text" class="krds-input p0" placeholder="입력해 주세요">
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>영문 주소<span class="point">*</span></label></div>
                                    </div>
                                    <div class="form-conts">
                                        <div class="form-inp">
                                            <input type="text" class="krds-input p0" placeholder="영문 주소">
                                        </div>
                                        <div class="btn_right_area">
                                            <button type="button" class="area_btn blue">행안부 도로명 주소</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="bg_line"></div>
                        <div class="pro_anagement_cont">
                            <div class="fieldset">
                                
                                <div class="hf-form-section-tit">일자별거래내역</div>
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont">
                                        <div class="form-tit"><label>조회 기간</label></div>
                                    </div>
                                    <div class="form-conts">
                                        <div class="sort_area">
                                            <div class="calendar-input">
                                                <input type="text" id="ownerBirth" class="krds-input datepicker cal" placeholder="선택해 주세요">
                                                <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                                    <span class="sr-only">달력 열기</span>
                                                    <i class="svg-icon ico-calendar"></i>
                                                </button>
                                            </div>
                                            <button type="button" class="area_btn">조회</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="main_tit_area m0">
                                    <div class="title medium">일자별거래내역 합계</div>
                                </div>
                                <div class="com_info_list_cont bg">
                                    <ul class="list">
                                        <li><div class="cont">
                                            <div class="box"><div class="tit">합계</div></div>
                                            <div class="box"><div class="txt">0</div></div>
                                        </div></li>
                                        <li><div class="cont">
                                            <div class="box"><div class="tit">원금</div></div>
                                            <div class="box"><div class="txt">0</div></div>
                                        </div></li>
                                        <li><div class="cont">
                                            <div class="box"><div class="tit">이자</div></div>
                                            <div class="box"><div class="txt">0</div></div>
                                        </div></li>
                                        <li><div class="cont">
                                            <div class="box"><div class="tit">지연배상금</div></div>
                                            <div class="box"><div class="txt">0</div></div>
                                        </div></li>
                                        <li><div class="cont">
                                            <div class="box"><div class="tit">환출이자</div></div>
                                            <div class="box"><div class="txt">0</div></div>
                                        </div></li>
                                        <li><div class="cont">
                                            <div class="box"><div class="tit">조기상환</div></div>
                                            <div class="box"><div class="txt">0</div></div>
                                        </div></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="btn_cont page">
                        <button type="button" class="com_btn" disabled>발급</button>
                    </div>
                </div>
            </div>
