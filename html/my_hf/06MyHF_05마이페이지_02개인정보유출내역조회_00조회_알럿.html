    <body>
        <div class="wrapper sub" id="app">
            <div data-include="../inc/header.html"></div>
            <div id="container">
                <div class="container_in">
                    <div class="contents">
                        <div class="pro_anagement_cont gap">
                            <div class="fieldset">
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont"><div class="form-tit"><label for="leakBirth">생년월일 <span class="point">*</span></label></div></div>
                                    <div class="form-conts">
                                        <div class="calendar-input"><input type="text" id="leakBirth" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" readonly title="생년월일 선택"><button type="button" class="krds-btn medium icon form-btn-datepicker"><i class="svg-icon ico-calendar"></i><span class="sr-only">달력 열기</span></button></div>
                                    </div>
                                </div>
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont"><div class="form-tit"><label for="leakAcc">거래계좌번호 <span class="point">*</span></label></div></div>
                                    <div class="form-conts"><input type="text" id="leakAcc" class="krds-input" placeholder="입력해 주세요" title="거래계좌번호"></div>
                                </div>
                                <div class="form-group none_bg">
                                    <div class="form-tit-cont"><div class="form-tit"><label>거래금융기관 <span class="point">*</span></label></div></div>
                                    <div class="form-conts"><button type="button" class="slt_btn krds-slt-btn" data-pop="com_pop">선택해 주세요</button></div>
                                </div>
                            </div>
                        </div>
                        <div class="bg_line"></div>
                        <div class="pro_anagement_cont gap">
                            <div class="pro_anagement_chk_list_area">
                                <div class="fieldset">
                                    <div class="form-group none_bg"><div class="form-conts">
                                        <div class="hf-terms"><div class="hf-terms-box">
                                            <div class="hf-terms-tit">[필수] 개인정보이용동의</div>
                                            <div class="sec"><div class="s_tit">개인정보수집 및 이용목적</div><p class="txt">공사는 수집한 개인정보를 개인정보 유출조회 목적으로 활용합니다.</p></div>
                                            <div class="sec"><div class="s_tit">수집하는 개인정보 항목</div><p class="txt">필수적 정보 : 생년월일, 거래계좌번호, 거래금융기관</p></div>
                                            <div class="sec"><div class="s_tit">개인정보수집 보유 및 이용기간</div><p class="txt">위 개인정보 수집 및 이용에 대한 동의일로부터 5일 이내에 파기됩니다.</p></div>
                                            <div class="sec"><div class="s_tit">동의를 거부할 권리 및 동의를 거부할 경우의 불이익</div><p class="txt">위 수집항목 중 필수적 정보의 수집·이용에 동의하지 않으실 경우 개인정보 유출조회가 불가능합니다.</p></div>
                                        </div></div>
                                    </div></div>
                                    <div class="form-group none_bg"><div class="form-conts">
                                        <div class="chip-wrap cunt auto">
                                            <div class="krds-form-chip type1"><input type="radio" name="leakAgree" id="leakAg1" checked class="radio"><label for="leakAg1">동의안함</label></div>
                                            <div class="krds-form-chip type1"><input type="radio" name="leakAgree" id="leakAg2" class="radio"><label for="leakAg2">동의함</label></div>
                                        </div>
                                    </div></div>
                                </div>
                            </div>
                        </div>
                        <div class="btn_cont page fixed">
                            <button type="button" class="com_btn blue2">유출 조회</button>
                        </div>
                    </div>
                </div>
            </div>
            <div data-include="../inc/footer.html"></div>
            <!-- 일치하는 생년월일<br>정보가 없습니다. -->
            <div class="com_pop_wrap w_min type21 active">
                <div class="com_pop_cont active">
                    <div class="title_area">
                        <button type="button" class="close" title="팝업 닫기"></button>
                    </div>
                    <div class="com_pop_content">
                        <div class="main_tit_area">
                            <div class="title small">알림</div>
                            <div class="title">일치하는 생년월일<br>정보가 없습니다.</div>

                        </div>
