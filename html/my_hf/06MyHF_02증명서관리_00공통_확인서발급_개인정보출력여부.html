    <body>
        <div class="wrapper sub" id="app">
            <div data-include="../inc/header.html"></div>
            <div id="container">
                <div class="container_in">
                    <div class="contents">
                        <div class="pro_anagement_cont gap">
                            <div class="section_tit_area">
                                <div class="tit">발급 받으실 증명서를<br>선택해 주세요</div>
                            </div>
                            <div class="cert_guide">
                                <div class="cert_guide_img"><img src="/resources/images/common/icon/ico_cert_issue.svg" alt=""></div>
                            </div>
                        </div>
                        <div class="btn_cont page fixed">
                            <button type="button" class="com_btn blue2">증명서 신청</button>
                        </div>
                    </div>
                </div>
            </div>
            <div data-include="../inc/footer.html"></div>

    <!-- 보증잔액확인서 발급 (bottom sheet) - 기본 상태 -->
    <div class="com_pop_wrap active type11">
        <div class="com_pop_cont type_bottom_sheet active">
            <div class="title_area">
                <div class="title">보증잔액확인서 발급</div>
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content">
                <!-- 개인정보 출력여부 -->
                <div class="cert_privacy_box">
                    <div class="cpb_tit">개인정보 출력여부 <span class="opt">(선택)</span></div>
                    <div class="krds-check-area chk-column">
                        <div class="krds-form-check">
                            <input type="checkbox" id="pv1">
                            <label for="pv1">주민등록번호를 전부 공개하여 발급</label>
                        </div>
                        <div class="krds-form-check">
                            <input type="checkbox" id="pv2">
                            <label for="pv2">대출계좌를 전부 공개하여 발급</label>
                        </div>
                    </div>
                </div>
                <!-- 발급 방법 -->
                <div class="cert_send_group">
                    <div class="cert_send_item">
                        <div class="krds-form-check">
                            <input type="checkbox" id="chkFax">
                            <label for="chkFax">FAX</label>
                        </div>
                        <div class="cert_input_row">
                            <div class="form-inp">
                                <button type="button" class="slt_btn">선택</button>
                            </div>
                            <span class="sep">-</span>
                            <div class="form-inp">
                                <input type="text" class="krds-input p0" title="FAX 국번" maxlength="4">
                            </div>
                            <span class="sep">-</span>
                            <div class="form-inp">
                                <input type="text" class="krds-input p0" title="FAX 뒷번호" maxlength="4">
                            </div>
                        </div>
                    </div>
                    <div class="bg_line"></div>
                    <div class="cert_send_item">
                        <div class="krds-form-check">
                            <input type="checkbox" id="chkEmail">
                            <label for="chkEmail">E-mail</label>
                        </div>
                        <div class="cert_input_row">
                            <div class="form-inp">
                                <input type="text" class="krds-input p0" title="이메일 아이디">
                            </div>
                            <span class="sep">@</span>
                            <div class="form-inp">
                                <button type="button" class="slt_btn">직접입력</button>
                            </div>
                        </div>
                        <p class="cert_send_desc red"><span class="red">※</span> 수신메일에 첨부된 PDF파일 비밀번호는 신청인의 주민번호 앞 6자리로 설정되어 있습니다.</p>
                    </div>
                    <div class="bg_line"></div>
                    <div class="krds-form-check">
                        <input type="checkbox" id="chkPdf">
                        <label for="chkPdf">PDF 직접 다운로드</label>
                    </div>
                </div>
            </div>
            <div class="btn_cont page">
                <button type="button" class="com_btn blue2">완료</button>
            </div>
        </div>
    </div>


        </div>
        <script type="text/javascript" src="/resources/js/include.js"></script>
