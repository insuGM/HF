<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="pro_anagement_cont gap">
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>신청사유<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <select class="krds-form-select" title="신청사유">
                                        <option value="">선택해 주세요.</option>
                                        <option value="1">자연재해</option>
                                        <option value="2">고용·산업위기지역</option>
                                        <option value="3">소송 진행</option>
                                        <option value="4">매매계약 체결</option>
                                        <option value="5">어린이집·아동복지시설</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cheobun_info_table">
                        <div class="row">
                            <span class="tit">산업위기대응 특별지역</span>
                            <span class="date">(없음) '23.1.1~'24.6.30</span>
                        </div>
                        <div class="row">
                            <span class="tit">고용위기지역</span>
                            <span class="date">거제(1) '23.1.1~'24.6.30</span>
                        </div>
                    </div>
                </div>
                <div class="pro_anagement_cont gap">
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>연락처<span class="point">*</span></label></div>
                                <button type="button" class="area_btn small">내정보 변경</button>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0 disabled" value="010-1234-****" title="연락처" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>처분약정주소<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0 disabled" value="(02049) 서울특별시 중랑구 봉화산로 **길 **" title="처분약정주소" disabled>
                                </div>
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0 disabled" value="가동 ***호 (중화동, 장미빌라타운)" title="처분약정주소 상세" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>위의 주소가 처분약정주소와 동일합니까?</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt auto">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" class="radio" name="sameAddr" id="sameAddr_0" checked>
                                        <label for="sameAddr_0">아니오</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" class="radio" name="sameAddr" id="sameAddr_1">
                                        <label for="sameAddr_1">예</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>처분약정주소(변경)</label></div>
                                <button type="button" class="btn blue">주소검색</button>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0 disabled" placeholder="주소를 검색해주세요" title="처분약정주소(변경)" disabled>
                                </div>
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0" placeholder="상세주소를 입력해주세요" title="상세주소">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn" disabled>신청</button>
            </div>
        </div>
