<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="pro_anagement_cont">
                    <div class="pro_anagement_list_area">
                        <ul class="list">
                            <li>
                                <div class="cont">
                                    <div class="main_tit_area m0">
                                        <div class="title">
                                            <h2>선납방식 선택</h2>
                                            <a href="#" class="link_btn">선납방식 변경 안내</a>
                                        </div>
                                    </div>
                                    <div class="chip-wrap cunt auto">
                                        <div class="krds-form-chip type1">
                                            <input type="radio" class="radio" name="prepayType" id="prepayType_0" disabled>
                                            <label for="prepayType_0">
                                                (A)형<br>조기상환수수료 면제방식 (현재 적용방식)
                                            </label>
                                        </div>
                                        <div class="krds-form-chip type1">
                                            <input type="radio" class="radio" name="prepayType" id="prepayType_1" checked>
                                            <label for="prepayType_1">(B)형</label>
                                            <div class="krds-form-check-cnt">
                                                <p class="krds-form-check-p">선납이자 면제방식</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </li>
                        </ul>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont gap down">
                    <div class="pro_anagement_chk_list_area">
                        <div class="fieldset">
                            <div class="form-group none_bg">
                                <div class="form-conts">
                                    <div class="krds-check-area chk-column">
                                        <div class="krds-form-check all">
                                            <input type="checkbox" id="agreeAll" checked>
                                            <label for="agreeAll">전체동의</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group none_bg">
                                <div class="form-conts gap_none">
                                    <div class="krds-check-area chk-column cont_line">
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_0" checked>
                                            <label for="agree_0">[필수] 선납이자, 조기상환수수료 관련 내용을 확인합니다.<br>(A형): 선납이자 부과, 조기상환수수료 면제<br>(B형): 선납이자 면제, 조기상환수수료 부과</label>
                                        </div>
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_1" checked>
                                            <label for="agree_1">[필수] 선납방식 변경이 본 대출 원리금상환액의 변동을 가져옴을 잘 숙지하고 있으며 이로 인해 면제에 따른 불이익이 발생하더라도 이의를 제기하지 않겠습니다.</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro_anagement_cont gap down">
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-conts">
                                <div class="com_list_bg_cont p0">
                                    <div class="com_list_bg_area gap">
                                        <ul class="krds-info-list decimal">
                                            <li>선납방식 변경은 신청 및 승인완료일 기준 차회분(다음 달)부터 적용되며, 상환스케줄 미리보기는 실제 원리금상환액과 다소 상이할 수 있습니다.</li>
                                        </ul>
                                        <div class="btn_cont">
                                            <button type="button" class="com_btn blue org m0">상환스케줄 미리보기</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn blue2">전자서명</button>
            </div>
        </div>
