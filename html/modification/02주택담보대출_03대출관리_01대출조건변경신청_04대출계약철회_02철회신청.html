                <div class="pro_anagement_cont gap">
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>철회신청 동의</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-txt">철회예정일을 선택하신 후, 아래의 신청 버튼을 클릭하여 주십시오.</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro_anagement_cont gap">
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label for="withdrawDate">철회예정일</label></div>
                            </div>
                            <div class="form-conts calendar-conts">
                                <div class="calendar-input">
                                    <input type="text" class="krds-input p0" value="2025.12.12" title="철회예정일" id="withdrawDate">
                                    <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                        <span class="sr-only">달력 열기</span>
                                        <i class="svg-icon ico-calendar"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-conts">
                                <div class="com_list_bg_cont p0">
                                    <div class="com_list_bg_area bg_none">
                                        <div class="main_tit_area m0">
                                            <div class="title">철회예정일 상환예정금액</div>
                                        </div>
                                        <div class="com_info_list_cont">
                                            <ul class="list">
                                                <li>
                                                    <div class="cont">
                                                        <div class="box">
                                                            <div class="tit">원금</div>
                                                        </div>
                                                        <div class="box">
                                                            <div class="txt">100,000,000원</div>
                                                        </div>
                                                    </div>
                                                </li>
                                                <li>
                                                    <div class="cont">
                                                        <div class="box">
                                                            <div class="tit">이자</div>
                                                        </div>
                                                        <div class="box">
                                                            <div class="txt">121,917원</div>
                                                        </div>
                                                    </div>
                                                </li>
                                                <li>
                                                    <div class="cont">
                                                        <div class="box">
                                                            <div class="tit">합계</div>
                                                        </div>
                                                        <div class="box">
                                                            <div class="txt">100,121,917원</div>
                                                        </div>
                                                    </div>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont gap down">
                    <div class="pro_anagement_chk_list_area">
                        <div class="fieldset">
                            <div class="form-group none_bg">
                                <div class="form-conts">
                                    <div class="krds-check-area chk-column">
                                        <div class="krds-form-check all">
                                            <input type="checkbox" id="agreeAll">
                                            <label for="agreeAll">
                                                전체동의
                                                <button type="button" data-pop="com_pop" class="btn">전체보기</button>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group none_bg">
                                <div class="form-conts gap_none">
                                    <div class="krds-check-area chk-column cont_line">
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_0">
                                            <label for="agree_0">[필수] 대출계약철회권은 다음과 같은 경우, 행사가 제한됩니다.</label>
                                        </div>
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_1">
                                            <label for="agree_1">[필수] 대출계약철회 신청 후, 반드시 부대비용(근저당권 설정비 및 인지세 등) 및 원리금 납부를 위하여 대출을 실행하신 해당 금융기관 영업점에 방문하셔야 합니다.</label>
                                        </div>
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_2">
                                            <label for="agree_2">[필수] 부대비용 금액은 금융기관에서 확인 가능합니다.</label>
                                        </div>
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_3">
                                            <label for="agree_3">반드시 기한 내 부대비용 및 원리금을 같은 날에 일시 납부하셔야 합니다.</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
