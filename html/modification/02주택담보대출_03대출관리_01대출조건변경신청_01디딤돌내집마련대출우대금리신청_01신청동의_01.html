    <title>한국주택금융공사</title>

    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_common/cms.css">

    <link rel="stylesheet" type="text/css" href="/resources/css/ex/slick.css">

    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/common01.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/faq01.css">

    <!-- JavaScript 파일들 -->
    <script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>

    <!-- !추가부분 -->
    <link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
    <link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">

    <script type="text/javascript" src="/resources/js/krds/krds.js"></script>
    <script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>

</head>
<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="pro_anagement_cont">
                    <div class="step_cont">
                        <span class="blue">2단계</span> / 3단계
                    </div>
                    <div class="step_list_cont type1 step3">
                        <ol class="krds-step-wrap">
                            <li class="done">
                                <span>
                                    <span class="tit">신청안내</span>
                                </span>
                            </li>
                            <li class="active">
                                <span>
                                    <em class="sr-only">현재단계</em>
                                    <span class="tit">신청동의</span>
                                </span>
                            </li>
                            <li>
                                <span>
                                    <span class="tit">신청확인</span>
                                </span>
                            </li>
                        </ol>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont gap down">
                    <div class="pro_anagement_chk_list_area">
                        <div class="fieldset">
                            <div class="form-group none_bg">
                                <div class="form-conts">
                                    <div class="krds-check-area chk-column">
                                        <div class="krds-form-check all">
                                            <input type="checkbox" id="agreeAll">
                                            <label for="agreeAll">
                                                [전체] 우대금리 서류제출 관련 대출신청인 동의
                                                <button type="button" data-pop="com_pop" class="btn">전체보기</button>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-conts gap_none">
                                    <div class="krds-check-area chk-column cont_line">
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_0">
                                            <label for="agree_0">[필수] 신청서류를 이미지화하여 업로드할 경우 객관적인 식별이 불가능하여 금리인하 반영이 이루어지지 않을 경우 이의를 제기하지 않겠습니다.</label>
                                        </div>
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_1">
                                            <label for="agree_1">[필수] 신청인 본인의 책임하에 이미지를 업로드하였으며, 공사가 요구하지 않은 제3자의 개인정보 유출로 인한 법적 책임은 전적으로 본인에게 있음을 잘 알고 있습니다.</label>
                                        </div>
                                        <div class="krds-form-check">
                                            <input type="checkbox" id="agree_2">
                                            <label for="agree_2">[필수] 제출한 서류가 허위로 확인되어 기한의 이익이 상실되더라도 이의를 제기하지 않겠습니다. (결혼예정자 특약에 따른 혼인 여부 확인 등)</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro_anagement_cont gap down">
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-conts">
                                <div class="com_list_bg_cont p0">
                                    <div class="com_list_bg_area gap">
                                        <div class="main_tit_area m0">
                                            <div class="title">우대금리 신청 사유</div>
                                        </div>
                                        <div class="krds-check-area type2">
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="rsn0">
                                                <label for="rsn0">유자녀</label>
                                            </div>
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="rsn1">
                                                <label for="rsn1">다문화</label>
                                            </div>
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="rsn2" checked>
                                                <label for="rsn2">장애인</label>
                                            </div>
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="rsn3">
                                                <label for="rsn3">한부모</label>
                                            </div>
                                            <div class="krds-form-check">
                                                <input type="checkbox" id="rsn4">
                                                <label for="rsn4">조기상환</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro_anagement_cont gap down">
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>장애인가구 우대금리 신청 대상이 본인입니까?</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt auto">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" class="radio" name="disOwner" id="disOwner_0">
                                        <label for="disOwner_0">아니오</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" class="radio" name="disOwner" id="disOwner_1" checked>
                                        <label for="disOwner_1">예</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>장애인이 만 14세 미만입니까?</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt auto">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" class="radio" name="disAge" id="disAge_0">
                                        <label for="disAge_0">아니오</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" class="radio" name="disAge" id="disAge_1" checked>
                                        <label for="disAge_1">예</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro_anagement_cont gap down">
                    <div class="fieldset">
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>세부사유 선택</label></div>
                            </div>
                            <div class="form-conts">
                                 <ul class="krds-info-list decimal">
                                    <li>담보대출 우대금리 대상이 본인이 아닌 가족구성원인 경우 개인(민감)정보제공동의를 하셔야 합니다.</li>
                                    <li>개인(민감)정보제공동의는 신청자가 직접 공유를 클릭하셔서 제공동의 요청을 해주세요.</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="btn_cont sub2">
                        <button type="button" class="com_btn" disabled>개인(민감)정보제공동의 공유</button>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn blue2">전자서명</button>
            </div>
        </div>
    </div>

    <div data-include="../inc/footer.html"></div>

</div>

<script type="text/javascript" src="/resources/js/include.js"></script>
</body>
</html>
