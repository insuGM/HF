<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents">
                <div class="pro_anagement_cont gap">
                    <div class="fieldset up">
                        <div class="form-group">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>소득정보 안내</label></div>
                                <button type="button" class="link_btn">소득정보 입력 안내</button>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>소득증빙 방법 여부<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeProof00" name="incomeProof" class="radio" checked>
                                        <label for="incomeProof00">본인</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeProof01" name="incomeProof" class="radio">
                                        <label for="incomeProof01">부부공동</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>소득증빙 방법 여부<span class="point">*</span></label></div>
                                <button type="button" class="link_btn">증빙·인정소득 정의</button>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeType00" name="incomeType" class="radio" checked>
                                        <label for="incomeType00">증빙소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeType01" name="incomeType" class="radio">
                                        <label for="incomeType01">인정소득</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group none_bg">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>소득 입력 방법<span class="point">*</span></label></div>
                                <button type="button" class="link_btn">마이데이터 소득 확인</button>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt type2">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeInput00" name="incomeInput" class="radio" checked>
                                        <label for="incomeInput00">공공마이데이터로 산출 된 소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeInput01" name="incomeInput" class="radio">
                                        <label for="incomeInput01">직접 입력</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg_line"></div>
                <div class="pro_anagement_cont">
                    <div class="fieldset">
                        <div class="form-group none_bg">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>소득합계</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="income_sum_cont">
                                    <div class="income_area">
                                        <div class="sum_top">
                                            <div class="sum_tit">
                                                <span class="tit">소득 제한</span>
                                                <span class="num">5,000</span>
                                            </div>
                                            <span class="unit">(단위: 만원)</span>
                                        </div>
                                        <div class="bar_line_cont">
                                            <div class="bar blue3" style="width: 100%;"></div>
                                        </div>
                                    </div>
                                    <ul class="sum_legend">
                                        <li>
                                            <div class="legend"><span class="dot blue3"></span>본인</div>
                                            <div class="val">5,500</div>
                                        </li>
                                        <li>
                                            <div class="legend"><span class="dot blue2"></span>여유 소득한도</div>
                                            <div class="val">0</div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                            <div class="form-conts">
                                <div class="warn_notice_box flex">
                                    <div class="ico"><img src="/resources/images/common/icon/ico_loan_mark_chk2.svg" alt=""></div>
                                    소득 한도를 초과하여 대출이 불가능합니다.
                                </div>
                            </div>
                            <div class="form-conts">
                                <div class="btn_cont m0">
                                    <button type="button" class="com_btn blue org">인정소득 대상확인</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="btn_cont page">
                <button type="button" class="com_btn" disabled>저장</button>
            </div>
        </div>
    </div>

    <div data-include="../inc/footer.html"></div>

</div>
