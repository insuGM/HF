                                <div class="form-tit"><label>부동산등기사항전부증명서<span class="point">*</span></label></div>

                                <ul class="krds-info-list decimal">

                                            <li class="gray"><span class="num">3.</span>사업계획승인서 상 재개발, 재건축 아파트가 아닐 것</li>
                                        </ul>
                                    </li>
                                </ul>
                            </div>
                        </div>

                                    </div>
