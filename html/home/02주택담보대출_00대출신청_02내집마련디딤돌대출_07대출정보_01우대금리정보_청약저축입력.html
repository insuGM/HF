    <div class="com_pop_wrap full active type11">
        <div class="com_pop_cont active">

                <div class="title">청약(종합)저축 입력</div>

                    </div>
                    <div class="fieldset">
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>가입기간</label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt wrap">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="savingsJoin00" name="savingsJoin" class="radio">

                                        <input type="radio" id="savingsJoin01" name="savingsJoin" class="radio">
                                        <label for="savingsJoin01">3년 이상</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>납입회차</label></div>
                            </div>

                                <div class="chip-wrap cunt wrap">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="savingsPay00" name="savingsPay" class="radio">
                                        <label for="savingsPay00">12회 이상</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="savingsPay01" name="savingsPay" class="radio">

                            <div class="form-tit-cont">

                                <div class="chip-wrap cunt wrap">
                                    <div class="krds-form-chip type1">

                                    </div>

                                        <input type="radio" id="savingsDeposit01" name="savingsDeposit" class="radio">
                                        <label for="savingsDeposit01">3년 이상</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">

                            </div>

                        <div class="form-group">
