<body>

<div class="wrapper sub" id="app">
    <div data-include="../inc/header.html"></div>

    <div id="container">
        <div class="container_in">

            <div class="contents none_bg">
            </div>
        </div>
    </div>

    <div data-include="../inc/footer.html"></div>

    
    <!-- TYPE1 -->
    <div class="com_pop_wrap full active type11">
        <div class="com_pop_cont active">
            <div class="title_area">
                <div class="title">소득 상세</div>
                <button type="button" class="close" title="팝업 닫기"></button>
            </div>
            <div class="com_pop_content">
                <div class="pro_anagement_cont gap">
                    <div class="sub_main_tit_area gap">
                        <div class="title">현재 재직(사업영위) 중인<br>직장(사업장)만 등록해 주세요.</div>
                        <div class="txt">소득발생시작일을 입력하고 내용을 확인 하신 후<br>저장해주시기 바랍니다.</div>
                    </div>
                    <div class="fieldset">
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>소득종류<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt wrap">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeKind00" name="incomeKind" class="radio">
                                        <label for="incomeKind00">근로소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeKind01" name="incomeKind" class="radio" checked>
                                        <label for="incomeKind01">사업소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeKind02" name="incomeKind" class="radio">
                                        <label for="incomeKind02">연금소득</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="incomeKind03" name="incomeKind" class="radio">
                                        <label for="incomeKind03">기타소득</label>
                                    </div>
                                </div>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list importance">
                                    <li class="gray">거주자의 사업소득 원천징수영수증으로 소득증빙시 총액의 60%가 소득으로 산정됩니다.</li>
                                </ul>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>직장명(사업장명)<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-inp">
                                    <input type="text" class="krds-input p0" placeholder="입력해 주세요." title="직장명(사업장명)">
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont type1">
                                <div class="form-tit"><label>재직(사업영위)기간<span class="point">*</span></label></div>
                                <button type="button" class="link_btn">인정소득 산정 안내</button>
                            </div>
                            <div class="form-conts">
                                <div class="chip-wrap cunt">
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="workPeriod00" name="workPeriod" class="radio" checked>
                                        <label for="workPeriod00">1년 1개월이상<br>(2개년 증빙)</label>
                                    </div>
                                    <div class="krds-form-chip type1">
                                        <input type="radio" id="workPeriod01" name="workPeriod" class="radio">
                                        <label for="workPeriod01">1년 미만<br>(1개년 증빙)</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>최근년도<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="number_area">
                                    <div class="calendar-input">
                                        <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="최근년도 시작일" id="recentS">
                                        <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                            <i class="svg-icon ico-calendar"></i>
                                        </button>
                                    </div>
                                    <span class="txt">-</span>
                                    <div class="calendar-input">
                                        <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="최근년도 종료일" id="recentE">
                                        <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                            <i class="svg-icon ico-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="form-conts">
                                <div class="form-text">
                                    <div class="text">
                                        <div class="num">영</div>
                                        <div class="txt">원</div>
                                    </div>
                                </div>
                                <div class="form-inp">
                                    <input type="text" class="krds-input" placeholder="0" title="최근년도 소득금액">
                                    <div class="txt">원</div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="form-tit-cont">
                                <div class="form-tit"><label>최종소득(예상)<span class="point">*</span></label></div>
                            </div>
                            <div class="form-conts">
                                <div class="form-text">
                                    <div class="text">
                                        <div class="num">영</div>
                                        <div class="txt">원</div>
                                    </div>
                                </div>
                                <div class="form-inp">
                                    <input type="text" class="krds-input" placeholder="0" title="최종소득(예상)" disabled>
                                    <div class="txt">원</div>
                                </div>
                            </div>
                            <div class="form-conts">
                                <div class="krds-check-area direction">
                                    <div class="krds-form-check">
                                        <input type="checkbox" id="regularIncome" checked>
                                        <label for="regularIncome">상시소득</label>
                                    </div>
                                    <button type="button" class="link_btn">상시소득 인정기준</button>
                                </div>
                            </div>
                            <div class="form-conts">
                                <ul class="krds-info-list importance">
                                    <li class="gray">상시소득자로 최근년도 소득이 적용됩니다.</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="btn_cont page">
                    <button type="button" class="com_btn" disabled>확인</button>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="text/javascript" src="/resources/js/include.js"></script>
