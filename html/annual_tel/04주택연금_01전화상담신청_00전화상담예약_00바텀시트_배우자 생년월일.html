<!DOCTYPE html>
<html lang="ko">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
        content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=yes">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko">
    <meta property="og:site_name" content="한국주택금융공사">
    <meta property="og:updated_time" content="">
    <meta name="twitter:card" content="summary">
    <title>한국주택금융공사</title>

    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_common/cms.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/cms-common.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/breadcrumb.widget.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/dictionary-of-terms.widget.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/dictionary-of-terms-sub.widget.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/cms-common.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/layout.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/font.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/board.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/sub.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/sub2.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/slick.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/board.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/header.content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/footer.content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/index.content.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_common/voc.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/common01.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/faq01.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/ex/_share/thumb01.css">

    <script type="text/javascript" src="/resources/js/jquery/jquery-2.2.4.min.js"></script>
    <script defer type="text/javascript" src="/resources/js/jquery/jquery-ui-1.12.1.min.js"></script>

    <link rel="stylesheet" type="text/css" href="/resources/js/krds/krds.css">
    <link rel="stylesheet" type="text/css" href="/resources/js/krds/pattern/output.css">
    <link rel="stylesheet" type="text/css" href="/resources/css/hf_home_ko.css">

    <script type="text/javascript" src="/resources/js/krds/krds.js"></script>
    <script type="text/javascript" src="/resources/js/krds/pattern/pattern.js"></script>
</head>

<body>

    <div class="wrapper sub" id="app">
        <div data-include="../inc/header.html"></div>

        <div id="container">
            <div class="container_in">

                <div class="contents">
                    <div class="pro_anagement_cont">
                        <div class="main_tit_area type1">
                            <div class="title">상담예약 정보</div>
                        </div>
                        <div class="fieldset cont_line type1 ">
                            <!-- 성명 -->
                            <div class="form-group none_bg">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label for="name">성명<span class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="form-inp">
                                        <input type="text" id="name" class="krds-input p0" placeholder="입력해 주세요.">
                                    </div>
                                </div>
                            </div>
                            <!-- 휴대전화 -->
                            <div class="form-group none_bg">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label for="mobileTel">휴대전화<span
                                                class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="form-inp">
                                        <input type="text" id="mobileTel" class="krds-input p0" placeholder="입력해 주세요.">
                                    </div>
                                </div>
                            </div>
                            <!-- 주택소유자 생년월일 -->
                            <div class="form-group none_bg">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label for="ownerBirth">주택소유자 생년월일<span
                                                class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="calendar-input">
                                        <input type="text" id="ownerBirth" class="krds-input datepicker cal"
                                            placeholder="선택해 주세요">
                                        <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                            <span class="sr-only">달력 열기</span>
                                            <i class="svg-icon ico-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- 배우자 생년월일 -->
                            <div class="form-group none_bg">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label for="spouseBirth">배우자 생년월일</label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="calendar-input">
                                        <input type="text" id="spouseBirth" class="krds-input datepicker cal"
                                            placeholder="선택해 주세요">
                                        <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                            <span class="sr-only">달력 열기</span>
                                            <i class="svg-icon ico-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- 담보주택주소 -->
                            <div class="form-group none_bg">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label>담보주택주소<span class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="form-inp type2">
                                        <input type="text" class="krds-input p0 disabled type1" title="우편번호" disabled>
                                        <button type="button" data-pop="con_pop" class="area_btn blue">주소검색</button>
                                    </div>
                                    <div class="form-inp">
                                        <input type="text" class="krds-input p0 disabled" placeholder="주소 검색 버튼을 눌러주세요."
                                            title="기본주소" disabled>
                                    </div>
                                    <div class="form-inp">
                                        <input type="text" class="krds-input p0" placeholder="입력해 주세요" title="상세주소">
                                    </div>
                                </div>
                            </div>
                            <!-- 상담희망일자 -->
                            <div class="form-group none_bg">
                                <div class="form-tit-cont">
                                    <div class="form-tit"><label for="consultDate">상담희망일자<span
                                                class="point">*</span></label></div>
                                </div>
                                <div class="form-conts">
                                    <div class="calendar-input">
                                        <input type="text" id="consultDate" class="krds-input datepicker cal"
                                            placeholder="선택해 주세요">
                                        <button type="button" class="krds-btn medium icon form-btn-datepicker">
                                            <span class="sr-only">달력 열기</span>
                                            <i class="svg-icon ico-calendar"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="pro_anagement_chk_list_area">
                            <div class="fieldset">
                                <div class="form-group none_bg">
                                    <div class="form-conts">
                                        <div class="krds-check-area chk-column">
                                            <div class="krds-form-check all">
                                                <input type="checkbox" id="agreePrivacy">
                                                <label for="agreePrivacy">
                                                    [필수]개인정보 수집 및 이용목적
                                                    <button type="button" data-pop="com_pop" class="btn">전체보기</button>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="btn_cont page hf-btn-area">
                    <button type="button" class="com_btn blue2" disabled>상담 예약하기</button>
                </div>

            </div>
        </div>

        <div data-include="../inc/footer.html"></div>
            <!-- 상담희망일자 -->
            <div class="com_pop_wrap type46">
                <div class="com_pop_cont type_bottom_sheet">
                    <div class="title_area">
                        <div class="title">상담희망일자</div>
                        <button type="button" class="close" title="팝업 닫기"></button>
                    </div>
                    <div class="com_pop_content">
                        <div class="fieldset"><div class="form-group"><div class="form-conts calendar-conts">
                            <div class="calendar-input">
                                <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="상담희망일자">
                                <button type="button" class="krds-btn medium icon form-btn-datepicker"><span class="sr-only">달력 열기</span><i class="svg-icon ico-calendar"></i></button>
                            </div>
                        </div></div></div>
                    </div>
                </div>
            </div>
            <!-- //상담희망일자 -->

            <!-- 담보주택주소 -->
            <div class="com_pop_wrap type45">
                <div class="com_pop_cont type_bottom_sheet">
                    <div class="title_area">
                        <div class="title">담보주택주소</div>
                        <button type="button" class="close" title="팝업 닫기"></button>
                    </div>
                    <div class="com_pop_content">
                        <div class="fieldset"><div class="form-group"><div class="form-conts">
                            <div class="form-inp btn"><input type="text" class="krds-input p0 disabled" placeholder="주소를 검색해 주세요" title="주소" disabled>
                                <button type="button" class="com_label_btn white">주소검색</button></div>
                            <div class="form-inp"><input type="text" class="krds-input p0" placeholder="상세 주소를 입력하세요." title="상세주소"></div>
                        </div></div></div>
                    </div>
                </div>
            </div>
            <!-- //담보주택주소 -->

            <!-- 배우자 생년월일 -->
            <div class="com_pop_wrap type44 active">
                <div class="com_pop_cont type_bottom_sheet active">
                    <div class="title_area">
                        <div class="title">배우자 생년월일</div>
                        <button type="button" class="close" title="팝업 닫기"></button>
                    </div>
                    <div class="com_pop_content">
                        <div class="fieldset"><div class="form-group"><div class="form-conts calendar-conts">
                            <div class="calendar-input">
                                <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="배우자 생년월일">
                                <button type="button" class="krds-btn medium icon form-btn-datepicker"><span class="sr-only">달력 열기</span><i class="svg-icon ico-calendar"></i></button>
                            </div>
                        </div></div></div>
                    </div>
                </div>
            </div>
            <!-- //배우자 생년월일 -->

            <!-- 주택소유자 생년월일 -->
            <div class="com_pop_wrap type43">
                <div class="com_pop_cont type_bottom_sheet">
                    <div class="title_area">
                        <div class="title">주택소유자 생년월일</div>
                        <button type="button" class="close" title="팝업 닫기"></button>
                    </div>
                    <div class="com_pop_content">
                        <div class="fieldset"><div class="form-group"><div class="form-conts calendar-conts">
                            <div class="calendar-input">
                                <input type="text" class="krds-input datepicker cal" placeholder="YYYY-MM-DD" title="주택소유자 생년월일">
                                <button type="button" class="krds-btn medium icon form-btn-datepicker"><span class="sr-only">달력 열기</span><i class="svg-icon ico-calendar"></i></button>
                            </div>
                        </div></div></div>
                    </div>
                </div>
            </div>
            <!-- //주택소유자 생년월일 -->

            <!-- 휴대전화 -->
            <div class="com_pop_wrap type42">
                <div class="com_pop_cont type_bottom_sheet">
                    <div class="title_area">
                        <div class="title">휴대전화</div>
                        <button type="button" class="close" title="팝업 닫기"></button>
                    </div>
                    <div class="com_pop_content">
                        <div class="fieldset"><div class="form-group"><div class="form-conts">
                            <div class="form-inp"><input type="text" class="krds-input p0" placeholder="'-'를 제외하고 입력해 주세요" title="휴대전화"></div>
                        </div></div></div>
                    </div>
                </div>
            </div>
            <!-- //휴대전화 -->

            <!-- 성명 -->
            <div class="com_pop_wrap type41">
                <div class="com_pop_cont type_bottom_sheet">
                    <div class="title_area">
                        <div class="title">성명</div>
                        <button type="button" class="close" title="팝업 닫기"></button>
                    </div>
                    <div class="com_pop_content">
                        <div class="fieldset"><div class="form-group"><div class="form-conts">
                            <div class="form-inp"><input type="text" class="krds-input p0" placeholder="이름을 입력하세요" title="성명"></div>
                        </div></div></div>
                    </div>
                </div>
            </div>
            <!-- //성명 -->


    </div>

    <script type="text/javascript" src="/resources/js/include.js"></script>
</body>

</html>
